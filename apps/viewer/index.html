<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>3sec Football Manager</title>
    <meta name="theme-color" content="#121a21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="3sec FM" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" />
    <style>
      :root { color-scheme: dark; --bg:#0b1014; --panel:#121a21; --panel2:#0e151b; --line:#22303b; --text:#e7edf2; --muted:#93a4b3; --accent:#ffd166; --good:#5fd38a; --warn:#f4a259; --bad:#ef5b5b; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing:border-box; }
      button, .row, .tab { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
      #app { display:flex; flex-direction:column; height:100%; background:var(--bg); }
      #nav { display:flex; align-items:center; gap:4px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
      #nav .brand { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:18px; letter-spacing:.03em; margin-right:8px; color:var(--accent); }
      #nav .brand small { color:var(--muted); font-weight:600; font-size:12px; margin-left:6px; letter-spacing:0; }
      #nav button.tab { background:transparent; border:1px solid transparent; color:var(--muted); padding:6px 10px; border-radius:6px; font-weight:600; }
      #nav button.tab.active { color:var(--text); background:#1a2530; border-color:#2c3d4b; }
      #nav .spacer { flex:1; }
      #nav .season { font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--muted); }
      .screen { flex:1; min-height:0; overflow-y:auto; display:none; }
      .screen.active { display:flex; flex-direction:column; }
      .page { padding:14px; display:flex; flex-direction:column; gap:14px; max-width:980px; width:100%; margin:0 auto; }
      .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
      .card h3 { margin:0; font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline; }
      .card h3 span { font-family:"IBM Plex Mono", monospace; font-size:12px; text-transform:none; letter-spacing:0; }
      .fixture { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px; padding:8px 0; }
      .fixture .team { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:22px; }
      .fixture .team.r { text-align:right; }
      .fixture .team small { display:block; font-family:"IBM Plex Sans KR", sans-serif; font-weight:400; font-size:12px; color:var(--muted); }
      .fixture .vs { font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:13px; text-align:center; min-width:60px; }
      .fixture .vs b { display:block; font-size:20px; color:var(--text); }
      .actions { display:flex; gap:8px; flex-wrap:wrap; }
      button, select, input { background:#1a2530; color:var(--text); border:1px solid #2c3d4b; border-radius:6px; padding:6px 10px; font-size:14px; font-family:inherit; }
      button { cursor:pointer; } button:hover { background:#24333f; } button:disabled { opacity:.45; cursor:default; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
      button.primary { background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:600; }
      button.danger { border-color:var(--bad); color:var(--bad); background:transparent; }
      label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
      table.std { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
      table.std th, table.std td { padding:5px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
      table.std th { color:var(--muted); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
      table.std td.l, table.std th.l { text-align:left; }
      table.std tr.me td { background:#1c2a1f; }
      table.std tr.me td:first-child { border-left:3px solid var(--good); }
      .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
      .news { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
      .news div::before { content:"·"; margin-right:6px; color:var(--accent); }
      .result { display:grid; grid-template-columns: 1fr auto 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
      .result .r { text-align:right; } .result .sc { font-family:"IBM Plex Mono", monospace; min-width:54px; text-align:center; }
      .result.me { color:var(--accent); }
      .scorers { grid-column:1 / -1; font-size:11px; color:var(--muted); line-height:1.5; }
      .hint { color:var(--muted); font-size:12px; line-height:1.5; }
      .guide h4 { margin:10px 0 4px; font-size:14px; color:var(--accent); }
      .guide p, .guide li { font-size:13px; line-height:1.6; color:var(--text); margin:0; }
      .guide ul { margin:0; padding-left:18px; }
      .guide .kbd { font-family:"IBM Plex Mono", monospace; background:#1a2530; border:1px solid #2c3d4b; border-radius:4px; padding:0 5px; font-size:12px; }
      .guide details { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--panel2); }
      .guide summary { cursor:pointer; font-weight:600; font-size:14px; }
      /* onboarding */
      body.onboarding #nav { display:none; }
      body.onboarding #app { padding-bottom:0; }
      .onb-title { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight:700; font-size:26px; letter-spacing:.02em; color:var(--text); line-height:1.2; }
      .onb-welcome input { flex:1; min-width:0; max-width:260px; }
      .club-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
      .club-card { display:flex; flex-direction:column; gap:6px; align-items:stretch; text-align:left; padding:10px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; min-width:0; cursor:pointer; }
      .club-card:hover { background:#18232d; border-color:#2c3d4b; }
      .club-card.sel { border-color:var(--accent); background:#1d2733; box-shadow:0 0 0 1px var(--accent) inset; }
      .club-card .cc-head { display:flex; align-items:center; gap:4px; min-width:0; }
      .club-card .cc-head b { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .club-card .cc-head small { color:var(--muted); font-size:11px; margin-left:auto; font-family:"IBM Plex Mono", monospace; }
      .club-card .cc-meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
      .club-card .stars { color:var(--accent); letter-spacing:.05em; font-size:13px; } .club-card .stars i { font-style:normal; color:#2c3d4b; }
      .club-card .cc-form { font-family:"IBM Plex Mono", monospace; color:var(--muted); }
      .club-card .cc-blurb { font-size:12px; color:var(--muted); line-height:1.45; }
      .onb-actions { align-items:center; }
      .card h3 .mgr { color:var(--accent); margin-left:6px; margin-right:auto; }
      /* squad */
      .squad-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .roster { display:flex; flex-direction:column; gap:3px; margin-top:6px; }
      .row { display:grid; grid-template-columns: 26px 30px 1fr 64px; gap:6px; align-items:center; padding:4px 6px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
      .row.wide { grid-template-columns: 26px 34px 1fr 40px 34px 64px 70px; }
      .row.tr { grid-template-columns: 26px 34px 1fr 40px 34px 56px 150px; }
      .row.tr button { white-space:nowrap; width:100%; }
      .row.yt { grid-template-columns: 34px 1fr 40px 64px 150px; cursor:default; }
      .row.yt .pot { font-family:"IBM Plex Mono", monospace; font-size:12px; text-align:right; color:var(--muted); }
      .row.yt .acts { display:flex; gap:4px; justify-content:flex-end; }
      .row.yt .acts button { padding:3px 8px; font-size:12px; white-space:nowrap; }
      .row:hover { background:#18232d; }
      .row.sel { border-color:var(--accent); background:#1d2733; }
      .row.off { opacity:.45; }
      .row .num { font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:12px; }
      .row .role { font-size:11px; color:var(--muted); letter-spacing:.04em; }
      .row .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .row .ovr { font-family:"IBM Plex Mono", monospace; font-weight:600; text-align:right; }
      .row .age { font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:12px; text-align:right; }
      .row .st { font-size:11px; color:var(--warn); text-align:right; }
      .row .card { display:inline-block; width:7px; height:10px; background:#ffd60a; border-radius:1px; margin-left:4px; vertical-align:middle; }
      .row .card.red { background:var(--bad); }
      .bar { height:8px; background:#1c2833; border-radius:4px; overflow:hidden; }
      .bar i { display:block; height:100%; border-radius:4px; }
      .tactic { display:grid; grid-template-columns: 64px 1fr 44px; gap:8px; align-items:center; margin-top:6px; }
      .tactic input[type=range] { width:100%; padding:0; accent-color:var(--accent); background:transparent; border:0; }
      .tactic .val { font-family:"IBM Plex Mono", monospace; color:var(--muted); text-align:right; font-size:12px; }
      .tactic .lbl { color:var(--muted); }
      /* match */
      #topbar { display:flex; gap:12px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
      #score { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight:700; font-size:24px; min-width:180px; letter-spacing:.02em; }
      #clock { font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; color:var(--muted); min-width:64px; }
      #phase { color:var(--accent); font-size:13px; min-width:70px; }
      #stats { display:flex; gap:18px; padding:5px 14px; font-size:12px; color:var(--muted); background:var(--panel2); flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      #stats b { color:var(--text); font-weight:600; margin-right:4px; }
      #others { display:flex; gap:14px; padding:4px 14px; font-size:12px; color:var(--muted); background:var(--panel2); border-top:1px solid var(--line); flex-wrap:wrap; font-family:"IBM Plex Mono", monospace; }
      #main { flex:1; display:flex; min-height:0; }
      #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; min-width:0; padding:8px; }
      canvas { max-width:100%; max-height:100%; touch-action:none; border-radius:4px; }
      #panel { width:320px; flex:none; overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 16px; display:flex; flex-direction:column; gap:14px; font-size:13px; }
      #panel h3 { margin:0; font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline; }
      #panel h3 span { font-family:"IBM Plex Mono", monospace; font-size:12px; text-transform:none; letter-spacing:0; }
      .subbox { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--panel2); display:flex; flex-direction:column; gap:6px; }
      .subbox .line { display:flex; justify-content:space-between; align-items:center; gap:8px; }
      .subbox .pend { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; align-items:center; }
      .subbox .pend button { padding:2px 8px; font-size:12px; }
      #btnSub { background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:600; width:100%; }
      #subMsg { font-size:12px; color:var(--warn); min-height:14px; }
      #log { height:120px; overflow-y:auto; font-size:12px; padding:6px 14px; background:var(--panel2); border-top:1px solid var(--line); font-family:"IBM Plex Mono", ui-monospace, monospace; }
      #log div { opacity:.9; line-height:1.55; }
      /* immersive match view: pitch fills the screen, manager panel becomes a drawer */
      .immersive #intro, .immersive #nav, .immersive #stats, .immersive #log { display:none !important; }
      .immersive #app { padding-bottom:0 !important; }
      .immersive #screen-match { position:fixed; inset:0; z-index:15; background:#000; }
      .immersive #topbar { position:absolute; top:0; left:0; right:0; z-index:2; background:rgba(11,16,20,.72); backdrop-filter:blur(6px); padding:4px 10px; padding-left:calc(10px + env(safe-area-inset-left)); gap:8px; flex-wrap:nowrap; overflow-x:auto; border-bottom:0; }
      .immersive #topbar #phase { flex-basis:auto; }
      .immersive #topbar label { white-space:nowrap; }
      .immersive #topbar button, .immersive #topbar select { white-space:nowrap; padding:4px 8px; font-size:13px; }
      .immersive #topbar #score { min-width:0; font-size:20px; white-space:nowrap; }
      .immersive #topbar #clock { min-width:0; white-space:nowrap; }
      .immersive #main { flex-direction:row !important; overflow:hidden !important; height:100%; }
      .immersive #stage { flex:1 !important; height:100% !important; max-height:none !important; padding:0 !important; }
      .immersive #panel { position:absolute; top:0; right:0; bottom:0; width:min(340px, 88vw); transform:translateX(100%); transition:transform .2s ease; z-index:3; border-left:1px solid var(--line); border-top:0; padding-top:44px; padding-right:calc(12px + env(safe-area-inset-right)); box-shadow:-8px 0 24px rgba(0,0,0,.5); }
      .immersive.panel-open #panel { transform:none; }
      .immersive #others { position:absolute; bottom:0; left:0; right:0; z-index:2; background:rgba(11,16,20,.6); border-top:0; padding:3px 10px calc(3px + env(safe-area-inset-bottom)); justify-content:center; }
      .immersive #btnPanel { display:inline-block !important; }
      #overlay { position:fixed; inset:0; background:rgba(5,8,11,0.82); display:none; align-items:center; justify-content:center; z-index:20; flex-direction:column; gap:10px; }
      #overlay.show { display:flex; }
      #overlay .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 22px; min-width:260px; text-align:center; }
      #overlay .prog { height:6px; background:#1c2833; border-radius:3px; overflow:hidden; margin-top:10px; }
      #overlay .prog i { display:block; height:100%; background:var(--accent); width:0; }
      @media (max-width: 860px) {
        .grid2 { grid-template-columns: 1fr; }
        .club-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; }
        .club-card { padding:9px 10px; }
        .club-card .cc-head b { font-size:16px; }
        .onb-title { font-size:22px; }
        .onb-actions .primary { flex:1; padding:10px; font-size:15px; }
        .card h3 .mgr { margin-right:0; }
        #app { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
        #nav { position:fixed; left:0; right:0; bottom:0; top:auto; z-index:10; border-top:1px solid var(--line); border-bottom:0; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); justify-content:space-around; background:#0f161cf2; backdrop-filter:blur(8px); }
        #nav .brand, #nav .spacer { display:none; }
        #nav .season { display:none; }
        #nav button.tab { flex:1; padding:9px 2px; font-size:13px; white-space:nowrap; min-width:0; }
        .page { padding:12px 10px; gap:10px; }
        .fixture .team { font-size:18px; }
        .row { padding:7px 6px; }
        #topbar { padding:6px 10px; gap:8px; padding-top: calc(6px + env(safe-area-inset-top)); }
        #topbar label { font-size:12px; }
        #intro { font-size:11px !important; padding:6px 10px !important; }
        #topbar #score { order:0; } #topbar #clock { order:1; } #topbar #phase { order:2; flex-basis:100%; min-height:0; }
        #stats { gap:10px; font-size:11px; }
        #others { gap:10px; }
        #main { flex-direction:column; overflow-y:auto; }
        #stage { flex:none; height:52vw; max-height:60vh; }
        #panel { width:auto; border-left:0; border-top:1px solid var(--line); }
        #score { font-size:20px; min-width:140px; }
        #log { height:100px; }
        .row.wide { grid-template-columns: 22px 30px 1fr 36px 56px; }
        .row.wide .age, .row.wide .st { display:none; }
        .row.tr { grid-template-columns: 22px 30px 1fr 36px 118px; }
        .row.tr .age, .row.tr .val { display:none; }
        .row.yt { grid-template-columns: 30px 1fr 36px 52px 112px; }
      }
      @media (max-width: 420px) { .club-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="nav">
        <span class="brand">3sec<small>풋볼 매니저</small></span>
        <button class="tab" data-screen="home">홈</button>
        <button class="tab" data-screen="squad">스쿼드</button>
        <button class="tab" data-screen="table">순위</button>
        <button class="tab" data-screen="transfers">이적</button>
        <button class="tab" data-screen="youth">유스</button>
        <button class="tab" data-screen="match" id="tabMatch" disabled>경기</button>
        <button class="tab" data-screen="guide" title="게임 가이드">?</button>
        <span class="spacer"></span>
        <span class="season" id="seasonLabel"></span>
      </nav>

      <section class="screen" id="screen-onboarding"><div class="page" id="onboarding"></div></section>
      <section class="screen" id="screen-home"><div class="page" id="home"></div></section>
      <section class="screen" id="screen-squad"><div class="page" id="squad"></div></section>
      <section class="screen" id="screen-table"><div class="page" id="tableView"></div></section>
      <section class="screen" id="screen-transfers"><div class="page" id="transfers"></div></section>
      <section class="screen" id="screen-youth"><div class="page" id="youth"></div></section>
      <section class="screen" id="screen-guide"><div class="page" id="guide"></div></section>
      <section class="screen" id="screen-results"><div class="page" id="results"></div></section>

      <section class="screen" id="screen-match">
        <div id="topbar">
          <div id="score">—</div>
          <div id="clock">00:00</div>
          <div id="phase"></div>
          <button id="btnPlay" class="primary">▶ 재생</button>
          <label>속도
            <select id="speed" title="자동: 골문 근처는 천천히, 중원과 중단 시간은 빠르게 (경기당 약 8~10분)">
              <option value="auto" selected>자동</option>
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
              <option value="16">16x</option>
              <option value="32">32x</option>
            </select>
          </label>
          <button id="btnSkip" title="남은 시간을 즉시 시뮬레이션합니다">⏩ 결과로</button>
          <button id="btnContinue" class="primary" style="display:none">계속 →</button>
          <button id="btnFull" title="경기장을 화면에 꽉 채웁니다 (가로 모드 권장)">⛶ 크게</button>
          <button id="btnPanel" style="display:none">☰ 전술·교체</button>
          <label><input id="debug" type="checkbox" /> 디버그</label>
        </div>
        <div id="stats"></div>
        <div id="main">
          <div id="stage"><canvas id="pitch"></canvas></div>
          <aside id="panel">
            <section>
              <h3>전술 <span id="teamName"></span></h3>
              <div class="tactic"><span class="lbl">포메이션</span>
                <select id="formation" style="grid-column: 2 / 4">
                  <option>4-3-3</option><option>4-4-2</option><option>4-2-3-1</option><option>3-5-2</option>
                </select>
              </div>
              <div id="sliders"></div>
            </section>
            <section>
              <h3>선발 <span id="subsUsed"></span></h3>
              <div id="lineup" class="roster"></div>
            </section>
            <section>
              <h3>벤치</h3>
              <div id="bench" class="roster"></div>
            </section>
            <section class="subbox">
              <div class="line"><span id="subPlan" class="hint">나갈 선수(선발)와 들어올 선수(벤치)를 차례로 선택하세요.</span></div>
              <button id="btnSub" disabled>교체 예약</button>
              <div id="subMsg"></div>
              <div id="pending"></div>
              <div class="hint">교체는 실제 규칙대로 다음 경기 중단(아웃/파울/골) 때 이루어집니다. 다른 경기장의 라운드 경기도 동시에 진행됩니다.</div>
            </section>
          </aside>
        </div>
        <div id="others"></div>
        <div id="log"></div>
      </section>
