<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>3sec Match Viewer</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #topbar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #111820; border-bottom: 1px solid #1f2a36; flex-wrap: wrap; }
      #score { font-weight: 700; font-size: 18px; min-width: 200px; }
      #clock { font-variant-numeric: tabular-nums; opacity: 0.85; min-width: 60px; }
      #phase { opacity: 0.7; font-size: 13px; }
      button, select, input { background: #1a2430; color: #e6edf3; border: 1px solid #2a3847; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
      button:hover { background: #22303f; cursor: pointer; }
      #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
      canvas { max-width: 100%; max-height: 100%; touch-action: none; }
      #log { height: 120px; overflow-y: auto; font-size: 12px; padding: 6px 12px; background: #0e141b; border-top: 1px solid #1f2a36; font-family: ui-monospace, monospace; }
      #log div { opacity: 0.85; }
      #stats { display: flex; gap: 16px; padding: 4px 12px; font-size: 12px; opacity: 0.8; background: #0e141b; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <div id="score">—</div>
        <div id="clock">00:00</div>
        <div id="phase"></div>
        <button id="btnPlay">▶ Play</button>
        <label>Speed
          <select id="speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
            <option value="16">16x</option>
          </select>
        </label>
        <label>Seed <input id="seed" type="number" value="1" style="width: 80px" /></label>
        <button id="btnRestart">↻ Restart</button>
        <label><input id="debug" type="checkbox" /> Debug</label>
      </div>
      <div id="stats"></div>
      <div id="stage"><canvas id="pitch"></canvas></div>
      <div id="log"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
