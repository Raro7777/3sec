<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>가난한자의 FM</title>
    <meta name="theme-color" content="#121a21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="가난한자의 FM" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" />
    <style>
      :root { color-scheme: dark; --bg:#0b1014; --panel:#121a21; --panel2:#0e151b; --line:#22303b; --text:#e7edf2; --muted:#93a4b3; --accent:#ffd166; --good:#5fd38a; --warn:#f4a259; --bad:#ef5b5b; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing:border-box; }
      [hidden] { display:none !important; }
      button, .row, .tab { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
      #app { display:flex; flex-direction:column; height:100%; background:var(--bg); }
      #nav { display:flex; align-items:center; gap:4px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
      #nav .brand { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:18px; letter-spacing:.03em; margin-right:8px; color:var(--accent); }
      #nav .brand small { color:var(--muted); font-weight:600; font-size:12px; margin-left:6px; letter-spacing:0; }
      #nav button.tab { background:transparent; border:1px solid transparent; color:var(--muted); padding:6px 10px; border-radius:6px; font-weight:600; }
      #nav button.tab.active { color:var(--text); background:#1a2530; border-color:#2c3d4b; }
      #nav .spacer { flex:1; }
      #nav .season { font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--muted); }
      .screen { flex:1; min-height:0; overflow-y:auto; display:none; }
      .screen.active { display:flex; flex-direction:column; }
      .page { padding:14px; display:flex; flex-direction:column; gap:14px; max-width:980px; width:100%; margin:0 auto; }
      .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
      .card h3 { margin:0; font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline; }
      .card h3 span { font-family:"IBM Plex Mono", monospace; font-size:12px; text-transform:none; letter-spacing:0; }
      .fixture { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px; padding:8px 0; }
      .fixture .team { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:22px; }
      .fixture .team.r { text-align:right; }
      .fixture .team small { display:block; font-family:"IBM Plex Sans KR", sans-serif; font-weight:400; font-size:12px; color:var(--muted); }
      .fixture .vs { font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:13px; text-align:center; min-width:60px; }
      .fixture .vs b { display:block; font-size:20px; color:var(--text); }
      .actions { display:flex; gap:8px; flex-wrap:wrap; }
      button, select, input { background:#1a2530; color:var(--text); border:1px solid #2c3d4b; border-radius:6px; padding:6px 10px; font-size:14px; font-family:inherit; }
      button { cursor:pointer; } button:hover { background:#24333f; } button:disabled { opacity:.45; cursor:default; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
      button.primary { background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:600; }
      button.danger { border-color:var(--bad); color:var(--bad); background:transparent; }
      label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
      table.std { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
      table.std th, table.std td { padding:5px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
      table.std th { color:var(--muted); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
      table.std td.l, table.std th.l { text-align:left; }
      table.std tr.me td { background:#1c2a1f; }
      table.std tr.me td:first-child { border-left:3px solid var(--good); }
      .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
      .news { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
      .news div::before { content:"·"; margin-right:6px; color:var(--accent); }
      .result { display:grid; grid-template-columns: 1fr auto 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
      .result .r { text-align:right; } .result .sc { font-family:"IBM Plex Mono", monospace; min-width:54px; text-align:center; }
      .result.me { color:var(--accent); }
      .scorers { grid-column:1 / -1; font-size:11px; color:var(--muted); line-height:1.5; }
      .hint { color:var(--muted); font-size:12px; line-height:1.5; }
      .slot { display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
      .slot .meta { font-size:12px; color:var(--muted); }
      .slot .btns { display:flex; gap:4px; }
      textarea { width:100%; min-height:90px; background:#1a2530; color:var(--text); border:1px solid #2c3d4b; border-radius:6px; padding:6px; font-family:'IBM Plex Mono', monospace; font-size:11px; }
      .guide h4 { margin:10px 0 4px; font-size:14px; color:var(--accent); }
      .guide p, .guide li { font-size:13px; line-height:1.6; color:var(--text); margin:0; }
      .guide ul { margin:0; padding-left:18px; }
      .guide .kbd { font-family:"IBM Plex Mono", monospace; background:#1a2530; border:1px solid #2c3d4b; border-radius:4px; padding:0 5px; font-size:12px; }
      .guide details { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--panel2); }
      .guide summary { cursor:pointer; font-weight:600; font-size:14px; }
      /* onboarding */
      body.onboarding #nav { display:none; }
      body.onboarding #app { padding-bottom:0; }
      .onb-title { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight:700; font-size:26px; letter-spacing:.02em; color:var(--text); line-height:1.2; }
      .onb-welcome input { flex:1; min-width:0; max-width:260px; }
      .club-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
      .club-card { display:flex; flex-direction:column; gap:6px; align-items:stretch; text-align:left; padding:10px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; min-width:0; cursor:pointer; }
      .club-card:hover { background:#18232d; border-color:#2c3d4b; }
      .club-card.sel { border-color:var(--accent); background:#1d2733; box-shadow:0 0 0 1px var(--accent) inset; }
      .club-card .cc-head { display:flex; align-items:center; gap:4px; min-width:0; }
      .club-card .cc-head b { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .club-card .cc-head small { color:var(--muted); font-size:11px; margin-left:auto; font-family:"IBM Plex Mono", monospace; }
      .club-card .cc-meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
      .club-card .stars { color:var(--accent); letter-spacing:.05em; font-size:13px; } .club-card .stars i { font-style:normal; color:#2c3d4b; }
      .club-card .cc-form { font-family:"IBM Plex Mono", monospace; color:var(--muted); }
      .club-card .cc-blurb { font-size:12px; color:var(--muted); line-height:1.45; }
      .onb-actions { align-items:center; }
      .card h3 .mgr { color:var(--accent); margin-left:6px; margin-right:auto; }
      /* cup & season review */
      .cupTag { display:inline-block; font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:12px; letter-spacing:.06em; color:#1a1400; background:var(--accent); border-radius:4px; padding:1px 6px; margin-right:6px; vertical-align:middle; }
      .fixture.cup .vs { color:var(--accent); }
      .cupLine { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
      .cupLine b { color:var(--accent); }
      .bracket { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; }
      .bracket .stage { display:flex; flex-direction:column; gap:4px; min-width:0; }
      .bracket .stageHead { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:14px; letter-spacing:.04em; color:var(--accent); }
      .bracket .stageHead small { color:var(--muted); font-family:"IBM Plex Mono", monospace; font-weight:400; margin-left:4px; }
      .bracket .tie { display:grid; grid-template-columns:1fr auto 1fr; gap:4px; align-items:center; font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); }
      .bracket .tie.me { border-color:var(--accent); }
      .bracket .tie > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .bracket .tie .w { color:var(--text); font-weight:600; } .bracket .tie .l { color:var(--muted); }
      .bracket .tie .sc { font-family:"IBM Plex Mono", monospace; text-align:center; display:flex; flex-direction:column; }
      .bracket .tie .sc small { font-size:10px; color:var(--accent); }
      .bracket .tie > span:last-child { text-align:right; }
      .review .rvTitle { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:40px; line-height:1; color:var(--accent); margin:4px 0; }
      .review .rvTitle small { font-size:16px; color:var(--muted); margin-left:6px; font-family:"IBM Plex Sans KR", sans-serif; font-weight:600; }
      .review .stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-top:8px; }
      .review .stat { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--panel2); display:flex; flex-direction:column; gap:2px; min-width:0; }
      .review .stat small { color:var(--muted); font-size:11px; }
      .review .stat b { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .review .stat b small { font-size:11px; font-weight:400; }
      tr.rel td { color:var(--warn); } .relTag { display:inline-block; margin-left:4px; font-size:10px; color:var(--bad); }
      @media (max-width: 860px) { .bracket { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
      /* squad */
      .squad-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .fmWrap { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; margin-top:8px; }
      .fmBig { flex:none; width:min(100%, 250px); }
      .fmBig svg { width:100%; height:auto; display:block; border-radius:8px; }
      .fmList { flex:1; min-width:180px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; }
      .fmBtn { width:62px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px 3px 3px; text-align:center; font-size:11px; color:var(--text); cursor:pointer; }
      .fmBtn svg { width:100%; height:auto; display:block; }
      .fmBtn.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; color:var(--accent); }
      .fmBtn:disabled { opacity:.5; cursor:default; }
      .roster { display:flex; flex-direction:column; gap:3px; margin-top:6px; }
      .row { display:grid; grid-template-columns: 26px 30px 1fr 64px; gap:6px; align-items:center; padding:4px 6px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
      .row.wide { grid-template-columns: 26px 34px 1fr 40px 34px 64px 70px 24px; }
      .row.tr { grid-template-columns: 26px 34px 1fr 40px 34px 56px 150px 24px; }
      .row .info, .of-acts .info { padding:0; width:22px; height:22px; border-radius:50%; font-size:12px; line-height:20px; text-align:center; color:var(--muted); background:transparent; border-color:var(--line); justify-self:end; }
      .row .info:hover, .of-acts .info:hover { color:var(--accent); border-color:var(--accent); background:transparent; }
      /* board confidence strip (home) */
      .board { margin-top:6px; display:flex; flex-direction:column; gap:4px; }
      .board .boardHead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13px; }
      .board .boardHead b { font-family:"IBM Plex Mono", monospace; font-size:14px; }
      .board .boardHead small { color:var(--muted); font-size:12px; white-space:nowrap; }
      .board .bar { height:6px; }
      /* player profile */
      .profile .pfHead { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
      .profile .pfNum { font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:34px; color:var(--muted); min-width:44px; text-align:center; }
      .profile .pfName { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight:700; font-size:26px; line-height:1.1; }
      .profile .pfOvr { text-align:center; } .profile .pfOvr b { display:block; font-family:"IBM Plex Mono", monospace; font-size:24px; } .profile .pfOvr small { color:var(--muted); font-size:11px; }
      .profile .stats, .card .stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
      .card .stat { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--panel2); display:flex; flex-direction:column; gap:2px; min-width:0; }
      .card .stat small { color:var(--muted); font-size:11px; }
      .card .stat b { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .card .stat b small { font-size:11px; font-weight:400; }
      .stars { color:var(--accent); letter-spacing:.05em; } .stars i { font-style:normal; color:#2c3d4b; }
      .attrs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px 16px; }
      .attrGroup h4 { margin:0 0 4px; font-size:12px; color:var(--accent); letter-spacing:.04em; }
      .attr { display:grid; grid-template-columns:64px 1fr 22px; gap:8px; align-items:center; font-size:12px; padding:2px 0; }
      .attr span:first-child { color:var(--muted); }
      .attr .bar { height:7px; } .attr b { font-family:"IBM Plex Mono", monospace; text-align:right; font-weight:600; }
      .chips { display:flex; gap:6px; flex-wrap:wrap; }
      .chip { display:inline-block; min-width:40px; text-align:center; padding:3px 8px; border-radius:12px; font-family:"IBM Plex Mono", monospace; font-size:12px; font-weight:600; color:#0b1014; }
      .row.tr button { white-space:nowrap; width:100%; }
      .row.yt { grid-template-columns: 34px 1fr 40px 64px 150px; cursor:default; }
      .offer { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:6px 8px; border:1px solid var(--line); border-radius:8px; }
      .offer .of-main { min-width:0; flex:1 1 200px; }
      .offer .of-main .role { font-size:11px; color:var(--muted); }
      .offer .of-acts { display:flex; gap:4px; flex-wrap:wrap; }
      .offer .of-acts button { white-space:nowrap; }
      .row.yt .pot { font-family:"IBM Plex Mono", monospace; font-size:12px; text-align:right; color:var(--muted); }
      .row.yt .acts { display:flex; gap:4px; justify-content:flex-end; }
      .row.yt .acts button { padding:3px 8px; font-size:12px; white-space:nowrap; }
      .row:hover { background:#18232d; }
      .row.sel { border-color:var(--accent); background:#1d2733; }
      .row.off { opacity:.45; }
      .row .num { font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:12px; }
      .row .role { font-size:11px; color:var(--muted); letter-spacing:.04em; }
      .row .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .row .ovr { font-family:"IBM Plex Mono", monospace; font-weight:600; text-align:right; }
      .row .age { font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:12px; text-align:right; }
      .row .st { font-size:11px; color:var(--warn); text-align:right; }
      .row .card { display:inline-block; width:7px; height:10px; background:#ffd60a; border-radius:1px; margin-left:4px; vertical-align:middle; }
      .row .card.red { background:var(--bad); }
      .bar { height:8px; background:#1c2833; border-radius:4px; overflow:hidden; }
      .bar i { display:block; height:100%; border-radius:4px; }
      .tactic { display:grid; grid-template-columns: 64px 1fr 44px; gap:8px; align-items:center; margin-top:6px; }
      .tactic input[type=range] { width:100%; padding:0; accent-color:var(--accent); background:transparent; border:0; }
      .tactic .val { font-family:"IBM Plex Mono", monospace; color:var(--muted); text-align:right; font-size:12px; }
      .tactic .lbl { color:var(--muted); }
      /* match */
      #topbar { display:flex; gap:12px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
      #score { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight:700; font-size:24px; min-width:180px; letter-spacing:.02em; }
      #clock { font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; color:var(--muted); min-width:64px; }
      #phase { color:var(--accent); font-size:13px; min-width:70px; }
      #stats { display:flex; gap:18px; padding:5px 14px; font-size:12px; color:var(--muted); background:var(--panel2); flex-wrap:wrap; font-variant-numeric:tabular-nums; }
      #stats b { color:var(--text); font-weight:600; margin-right:4px; }
      #others { display:flex; gap:14px; padding:4px 14px; font-size:12px; color:var(--muted); background:var(--panel2); border-top:1px solid var(--line); flex-wrap:wrap; font-family:"IBM Plex Mono", monospace; }
      #main { flex:1; display:flex; min-height:0; }
      #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; min-width:0; padding:8px; position:relative; }
      #ftOverlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:4; pointer-events:none; }
      #ftOverlay .ftCard { pointer-events:auto; background:rgba(11,16,20,.88); border:1px solid var(--accent); border-radius:14px; padding:14px 22px 16px; text-align:center; box-shadow:0 0 40px rgba(242,193,78,.25); backdrop-filter:blur(4px); }
      #ftOverlay .ftTitle { font-family:"Barlow Condensed","IBM Plex Sans KR",sans-serif; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
      #ftOverlay #ftScore { font-family:"Barlow Condensed","IBM Plex Sans KR",sans-serif; font-size:30px; font-weight:700; margin:2px 0 4px; white-space:nowrap; }
      #ftOverlay #btnContinue2 { margin-top:8px; font-size:16px; padding:10px 22px; }
      .finished #btnPlay, .finished #btnSkip, .finished #speed { display:none !important; }
      canvas { max-width:100%; max-height:100%; touch-action:none; border-radius:4px; }
      #panel { width:320px; flex:none; overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 16px; display:flex; flex-direction:column; gap:14px; font-size:13px; }
      #panel h3 { margin:0; font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline; }
      #panel h3 span { font-family:"IBM Plex Mono", monospace; font-size:12px; text-transform:none; letter-spacing:0; }
      .subbox { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--panel2); display:flex; flex-direction:column; gap:6px; }
      .subbox .line { display:flex; justify-content:space-between; align-items:center; gap:8px; }
      .subbox .pend { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; align-items:center; }
      .subbox .pend button { padding:2px 8px; font-size:12px; }
      #btnSub { background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:600; width:100%; }
      #subMsg { font-size:12px; color:var(--warn); min-height:14px; }
      #log { height:120px; overflow-y:auto; font-size:12px; padding:6px 14px; background:var(--panel2); border-top:1px solid var(--line); font-family:"IBM Plex Mono", ui-monospace, monospace; }
      #log div { opacity:.9; line-height:1.55; }
      /* ---- sub-tabs, bottom sheet, progress button */
      .subtabs { display:flex; gap:4px; position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0 8px; }
      .subtabs button { flex:1; padding:9px 4px; font-size:13px; border-radius:8px; min-width:0; white-space:nowrap; }
      .subtabs button.on { background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:700; }
      .subtabs .badge { display:inline-block; min-width:16px; padding:0 4px; border-radius:8px; background:var(--bad); color:#fff; font-style:normal; font-size:11px; line-height:16px; margin-left:2px; }
      .subtabs button.on .badge { background:#1a1400; color:var(--accent); }
      .subpanel { display:flex; flex-direction:column; gap:14px; }
      .subpanel[hidden] { display:none; }
      #sheet { position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center; }
      #sheet[hidden] { display:none; }
      #sheet .sheetBack { position:absolute; inset:0; background:rgba(0,0,0,.6); }
      #sheet .sheetBody { position:relative; width:100%; max-width:560px; max-height:calc(100vh - 20px); max-height:calc(100dvh - 20px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-bottom:0; border-radius:16px 16px 0 0; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.55); animation:sheetUp .18s ease-out; }
      @keyframes sheetUp { from { transform:translateY(24px); opacity:.6; } to { transform:none; opacity:1; } }
      @media (prefers-reduced-motion: reduce) { #sheet .sheetBody { animation:none; } }
      .pc { display:flex; flex-direction:column; gap:8px; }
      .pcHead { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; }
      .pcNum { font-family:"Barlow Condensed", sans-serif; font-size:30px; font-weight:700; color:var(--muted); min-width:34px; text-align:center; }
      .pcName { font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:22px; font-weight:700; line-height:1.1; }
      .pcOvr { text-align:right; } .pcOvr b { display:block; font-family:"Barlow Condensed", sans-serif; font-size:30px; line-height:1; } .pcOvr small { color:var(--muted); font-size:11px; }
      .pcStats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; }
      .pcStats > div { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:5px 7px; font-size:11px; color:var(--muted); min-width:0; }
      .pcStats b { display:block; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .pcStats small { display:block; font-size:10px; }
      .pcStats.wrap b { white-space:normal; font-size:12px; line-height:1.25; }
      .pcMid { display:grid; grid-template-columns:150px 1fr; gap:10px; align-items:center; }
      .pcAttrs { display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; font-size:12px; }
      .pcAttrs > div { display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:2px 0; } .pcAttrs b { font-family:"IBM Plex Mono", monospace; }
      .pcSeason { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); align-items:center; } .pcSeason b { color:var(--text); }
      .pcSeason .chips { display:inline-flex; gap:3px; } .pcSeason .chip { min-width:30px; padding:1px 5px; font-size:11px; }
      .pcActions { display:flex; gap:6px; flex-wrap:wrap; } .pcActions button { flex:1; min-height:38px; white-space:nowrap; }
      .cmpHead { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; }
      .cmpHead .vs { font-family:"Barlow Condensed", sans-serif; font-weight:700; color:var(--muted); }
      .cmpP b { display:block; font-family:"Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-size:20px; } .cmpP small { color:var(--muted); font-size:11px; }
      .cmpRows { display:flex; flex-direction:column; }
      .cmpRow { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; padding:3px 0; border-bottom:1px dashed var(--line); font-size:13px; }
      .cmpRow span { color:var(--muted); font-size:11px; text-align:center; min-width:70px; }
      .cmpRow b { font-family:"IBM Plex Mono", monospace; font-weight:500; color:var(--muted); } .cmpRow b:last-child { text-align:right; }
      .cmpRow b.w { color:var(--good); font-weight:700; }
      #cta { position:fixed; right:14px; bottom:14px; z-index:12; padding:12px 20px; font-size:15px; font-weight:700; border-radius:999px; background:var(--accent); color:#1a1400; border:0; box-shadow:0 8px 24px rgba(0,0,0,.5); }
      #cta.warn { background:var(--warn); }
      #cta[hidden], .immersive #cta, body.onboarding #cta { display:none !important; }
      #app { padding-bottom:72px; }
      table.std tr[data-club]:active td { background:#1a2530; }
      /* immersive match view: pitch fills the screen, manager panel becomes a drawer */
      .immersive #intro, .immersive #nav, .immersive #stats { display:none !important; }
      /* the running commentary stays visible as a translucent strip over the bottom-left of the pitch */
      .immersive #log { position:absolute; left:calc(8px + env(safe-area-inset-left)); bottom:32px; z-index:2; width:min(48vw, 440px); height:auto; max-height:84px; overflow:hidden; background:rgba(11,16,20,.55); backdrop-filter:blur(4px); border:0; border-radius:8px; padding:4px 8px; font-size:12px; line-height:1.35; pointer-events:none; display:flex; flex-direction:column; justify-content:flex-end; }
      .immersive.dock #log { width:min(40vw, 400px); }
      .immersive #app { padding-bottom:0 !important; }
      .immersive #screen-match { position:fixed; inset:0; z-index:15; background:#000; }
      .immersive #topbar { position:absolute; top:0; left:0; right:0; z-index:2; background:rgba(11,16,20,.72); backdrop-filter:blur(6px); padding:4px 10px; padding-left:calc(10px + env(safe-area-inset-left)); gap:8px; flex-wrap:nowrap; overflow-x:auto; border-bottom:0; }
      .immersive #topbar #phase { flex-basis:auto; }
      .immersive #topbar label { white-space:nowrap; }
      .immersive #topbar button, .immersive #topbar select { white-space:nowrap; padding:4px 8px; font-size:13px; }
      .immersive #topbar > * { flex:none; }
      .immersive #topbar label.dbg { display:none; }
      .immersive #topbar #score { min-width:0; font-size:20px; white-space:nowrap; }
      .immersive #topbar #clock { min-width:0; white-space:nowrap; }
      .immersive #main { flex-direction:row !important; overflow:hidden !important; height:100%; }
      .immersive #stage { flex:1 !important; height:100% !important; max-height:none !important; padding:0 !important; }
      .immersive #panel { position:absolute; top:0; right:0; bottom:0; width:min(340px, 88vw); transform:translateX(100%); transition:transform .2s ease; z-index:3; border-left:1px solid var(--line); border-top:0; padding-top:44px; padding-right:calc(12px + env(safe-area-inset-right)); box-shadow:-8px 0 24px rgba(0,0,0,.5); }
      .immersive.panel-open #panel { transform:none; }
      .immersive #others { position:absolute; bottom:0; left:0; right:0; z-index:2; background:rgba(11,16,20,.6); border-top:0; padding:3px 10px calc(3px + env(safe-area-inset-bottom)); justify-content:center; }
      .immersive #btnPanel { display:inline-block !important; }
      /* landscape with spare width: pitch on the left, manager panel docked on the right */
      .immersive.dock #stage { justify-content:flex-start; padding-left:calc(env(safe-area-inset-left)) !important; }
      .immersive.dock #panel { position:relative; transform:none; width:var(--dockw, 320px); flex:none; height:auto; border-left:1px solid var(--line); padding-top:52px; padding-bottom:28px; }
      .immersive.dock #btnPanel { display:none !important; }
      .immersive.dock #topbar { right:var(--dockw, 320px); }
      .immersive.dock #others { left:0; right:var(--dockw, 320px); }
      #overlay { position:fixed; inset:0; background:rgba(5,8,11,0.82); display:none; align-items:center; justify-content:center; z-index:20; flex-direction:column; gap:10px; }
      #overlay.show { display:flex; }
      #overlay .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 22px; min-width:260px; text-align:center; }
      #overlay .prog { height:6px; background:#1c2833; border-radius:3px; overflow:hidden; margin-top:10px; }
      #overlay .prog i { display:block; height:100%; background:var(--accent); width:0; }
      @media (max-width: 860px) {
        .grid2 { grid-template-columns: 1fr; }
        .club-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; }
        .club-card { padding:9px 10px; }
        .club-card .cc-head b { font-size:16px; }
        .onb-title { font-size:22px; }
        .onb-actions .primary { flex:1; padding:10px; font-size:15px; }
        .card h3 .mgr { margin-right:0; }
        #app { padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
        #cta { left:12px; right:12px; bottom:calc(62px + env(safe-area-inset-bottom)); padding:13px; font-size:16px; text-align:center; }
        .mgrcol { display:none; }
        table.std { font-size:12px; } table.std th, table.std td { padding:6px 4px; }
        .row { min-height:40px; }
        button, select { min-height:34px; }
        .pcMid { grid-template-columns:140px 1fr; }
        #nav { position:fixed; left:0; right:0; bottom:0; top:auto; z-index:10; border-top:1px solid var(--line); border-bottom:0; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); justify-content:space-around; background:#0f161cf2; backdrop-filter:blur(8px); }
        #nav .brand, #nav .spacer { display:none; }
        #nav .season { display:none; }
        #nav button.tab { flex:1; padding:9px 2px; font-size:13px; white-space:nowrap; min-width:0; }
        .page { padding:12px 10px; gap:10px; }
        .fixture .team { font-size:18px; }
        .row { padding:7px 6px; }
        #topbar { padding:6px 10px; gap:8px; padding-top: calc(6px + env(safe-area-inset-top)); }
        #topbar label { font-size:12px; }
        #intro { font-size:11px !important; padding:6px 10px !important; }
        #topbar #score { order:0; } #topbar #clock { order:1; } #topbar #phase { order:2; flex-basis:100%; min-height:0; }
        #stats { gap:10px; font-size:11px; }
        #others { gap:10px; }
        #main { flex-direction:column; overflow-y:auto; }
        #stage { flex:none; height:52vw; max-height:60vh; }
        #panel { width:auto; border-left:0; border-top:1px solid var(--line); }
        #score { font-size:20px; min-width:140px; }
        #log { height:100px; }
        .row.wide { grid-template-columns: 22px 30px 1fr 36px 56px 24px; }
        .row.wide .age, .row.wide .st { display:none; }
        /* phones: the price/offer controls drop to a second line so the name keeps the full width */
        .row.tr { grid-template-columns: 22px 30px minmax(0,1fr) 36px 24px; row-gap:3px; }
        .row.tr > span:nth-last-child(2) { order:9; grid-column:1 / -1; display:flex; justify-content:flex-end; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; }
        .row.tr > span:nth-last-child(2) button { width:auto; min-width:96px; padding:4px 10px; }
        .row.tr > span:nth-last-child(2) input { max-width:96px; }
        .profile .pfName { font-size:22px; }
        .attrs { grid-template-columns:1fr; }
        .row.tr .age, .row.tr .val { display:none; }
        .row.yt { grid-template-columns: 30px 1fr 36px 52px 112px; }
      }
      @media (max-width: 420px) { .club-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="nav">
        <span class="brand">가난한자의 FM<small>by raro</small></span>
        <button class="tab" data-screen="home">홈</button>
        <button class="tab" data-screen="squad">스쿼드</button>
        <button class="tab" data-screen="table">순위</button>
        <button class="tab" data-screen="transfers">이적</button>
        <button class="tab" data-screen="youth">유스</button>
        <button class="tab" data-screen="match" id="tabMatch" disabled>경기</button>
        <button class="tab" data-screen="settings" title="설정">⚙</button>
        <span class="spacer"></span>
        <span class="season" id="seasonLabel"></span>
      </nav>

      <section class="screen" id="screen-onboarding"><div class="page" id="onboarding"></div></section>
      <section class="screen" id="screen-home"><div class="page" id="home"></div></section>
      <section class="screen" id="screen-squad"><div class="page" id="squad"></div></section>
      <section class="screen" id="screen-table"><div class="page" id="tableView"></div></section>
      <section class="screen" id="screen-transfers"><div class="page" id="transfers"></div></section>
      <section class="screen" id="screen-youth"><div class="page" id="youth"></div></section>
      <section class="screen" id="screen-guide"><div class="page" id="guide"></div></section>
      <section class="screen" id="screen-settings"><div class="page" id="settings"></div></section>
      <section class="screen" id="screen-results"><div class="page" id="results"></div></section>
      <section class="screen" id="screen-review"><div class="page" id="review"></div></section>
      <section class="screen" id="screen-profile"><div class="page" id="profile"></div></section>
      <section class="screen" id="screen-sacked"><div class="page" id="sacked"></div></section>

      <section class="screen" id="screen-match">
        <div id="topbar">
          <div id="score">—</div>
          <div id="clock">00:00</div>
          <div id="phase"></div>
          <button id="btnPlay" class="primary">▶ 재생</button>
          <label>속도
            <select id="speed" title="자동: 골문 근처는 천천히, 중원과 중단 시간은 빠르게 (경기당 약 8~10분)">
              <option value="auto" selected>자동</option>
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
              <option value="16">16x</option>
              <option value="32">32x</option>
            </select>
          </label>
          <button id="btnSkip" title="남은 시간을 즉시 시뮬레이션합니다">⏩ 결과로</button>
          <button id="btnContinue" class="primary" style="display:none">계속 →</button>
          <button id="btnFull" title="경기장을 화면에 꽉 채웁니다 (가로 모드 권장)">⛶ 크게</button>
          <button id="btnSound" title="효과음">🔊</button>
          <button id="btnPanel" style="display:none">☰ 전술·교체</button>
          <label class="dbg"><input id="debug" type="checkbox" /> 디버그</label>
        </div>
        <div id="stats"></div>
        <div id="main">
          <div id="stage"><canvas id="pitch"></canvas>
            <div id="ftOverlay" hidden><div class="ftCard"><div class="ftTitle">경기 종료</div><div id="ftScore"></div><div id="ftNote" class="hint"></div><button id="btnContinue2" class="primary">다음으로 →</button></div></div>
          </div>
          <aside id="panel">
            <section>
              <h3>전술 <span id="teamName"></span></h3>
              <div class="tactic"><span class="lbl">포메이션</span>
                <select id="formation" style="grid-column: 2 / 4">
                  <option>4-3-3</option><option>4-4-2</option><option>4-2-3-1</option><option>3-5-2</option>
                </select>
              </div>
              <div id="sliders"></div>
            </section>
            <section>
              <h3>선발 <span id="subsUsed"></span></h3>
              <div id="lineup" class="roster"></div>
            </section>
            <section>
              <h3>벤치</h3>
              <div id="bench" class="roster"></div>
            </section>
            <section class="subbox">
              <div class="line"><span id="subPlan" class="hint">나갈 선수(선발)와 들어올 선수(벤치)를 차례로 선택하세요.</span></div>
              <button id="btnSub" disabled>교체 예약</button>
              <div id="subMsg"></div>
              <div id="pending"></div>
              <div class="hint">교체는 실제 규칙대로 다음 경기 중단(아웃/파울/골) 때 이루어집니다. 다른 경기장의 라운드 경기도 동시에 진행됩니다.</div>
            </section>
          </aside>
        </div>
        <div id="others"></div>
        <div id="log"></div>
      </section>

      <div id="overlay"><div class="box"><div id="overlayText">시뮬레이션 중…</div><div class="prog"><i id="overlayBar"></i></div></div></div>
    </div>
    <div id="sheet" hidden><div class="sheetBack"></div><div class="sheetBody" id="sheetBody"></div></div>
    <button id="cta" hidden>경기 시작 ▶</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
