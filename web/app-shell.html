    '플레이 ' + (meta.opens | 0) + '회차' + (days ? ' · 첫 실행 ' + days + '일 전' : ' · 오늘 처음'),
    '티켓 ' + (G ? G.tickets : '?') + ' · 골드 ' + (G ? (G.gold | 0) : '?') + ' · 로스터 ' + reps.length + '(연습생 ' + fillers + ') · 육성 ' + (G ? G.trainingCount : '?') + '회 · ' + (G ? G.wins + '승 ' + G.losses + '패' : ''),
    '빌드 ' + BUILD + ' · ' + dev + ' ' + window.innerWidth + '×' + window.innerHeight + ' · ' + ua.slice(0, 40),
  ];
  if (errs.length) lines.push('최근 오류: ' + errs.join(' / '));
  if (hist.length) lines.push('최근 기록: ' + hist.join(' / '));
  return lines.join('\n');
}
function vFeedback(){
  var canShare = !!(navigator.share);
  return h('<h2>피드백 보내기</h2>'+
   '<p class="sub">한 줄이면 충분합니다. 지금 화면·시즌·기기 정보가 자동으로 붙어서, 개발자가 같은 상황을 다시 만들 수 있습니다. 이름이나 연락처는 들어가지 않습니다.</p>'+
   '<div class="fb-kind">'+FB_KINDS.map(function(k){
     return '<button data-fbkind="'+k[0]+'"'+(fbKind===k[0]?' aria-current="true"':'')+'>'+k[1]+'</button>'; }).join('')+'</div>'+
   '<textarea class="fb-ta" id="fbText" placeholder="예) 육성 8턴에서 뭘 골라야 할지 모르겠어요 / 경기 화면 글자가 너무 작아요" maxlength="600">'+esc(fbText)+'</textarea>'+
   '<div class="btn-row" style="margin-top:12px">'+
     (canShare ? '<button class="btn" data-act="fbshare">공유하기</button>' : '')+
     '<button class="btn'+(canShare?' ghost':'')+'" data-act="fbcopy"'+(canShare?'':' style="grid-column:1/-1"')+'>복사하기</button>'+
   '</div>'+
   '<div class="tiny" style="margin:10px 0 6px">'+(canShare ? '공유하기를 누르면 메신저·메모로 바로 보낼 수 있습니다. ' : '')+'복사한 글을 개발자에게 메신저로 보내 주세요. 아래는 보내지는 내용입니다.</div>'+
   '<textarea class="fb-ta" id="fbBody" readonly>'+esc(feedbackBody())+'</textarea>'+
   '<button class="btn ghost" style="margin-top:12px" data-act="fbback">돌아가기</button>');
}
function readFbText(){ var el = document.getElementById('fbText'); if (el) fbText = el.value; }
function copyText(txt, done){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(copyFallback(txt)); });
  } else done(copyFallback(txt));
}
function copyFallback(txt){
  try {
    var el = document.getElementById('fbBody');
    if (!el) return false;
    el.value = txt; el.focus(); el.select(); el.setSelectionRange(0, txt.length);
    return document.execCommand && document.execCommand('copy');
  } catch(e){ return false; }
}

// ---------------------------------------------------------------- events
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-go],[data-act],[data-scoutpos],[data-pick],[data-sup],[data-choice],[data-auto],[data-play],[data-trainthis],[data-mv],[data-detail],[data-ltab],[data-fac],[data-report],[data-viewreport],[data-dex],[data-dexclub],[data-dexown],[data-fbkind]');
  if (!t) return;
  var d = t.dataset;

  if (d.tab) { if (ses && d.tab!=='train') return; go(d.tab==='train'&&ses?'trainTurn':d.tab); return; }
  if (d.go) { if (d.go === 'facility') facilityBack = 'home'; if (d.go === 'album') dexFocus = null; go(d.go); return; }
  if (d.fbkind) { readFbText(); fbKind = d.fbkind; render(); return; }
  if (d.act === 'fbshare') {
    readFbText();
    var body = feedbackBody();
    document.getElementById('fbBody').value = body;
    navigator.share({ title: '블룸 리그 피드백', text: body }).then(function(){ toast('보냈습니다. 고맙습니다!'); },
      function(err){ if (!err || err.name !== 'AbortError') copyText(body, function(ok){ toast(ok ? '공유 대신 복사했습니다' : '공유가 막혔습니다 — 아래 글을 길게 눌러 복사해 주세요'); }); });
    return;
  }
  if (d.act === 'fbcopy') {
    readFbText();
    var body2 = feedbackBody();
    var bodyEl = document.getElementById('fbBody'); if (bodyEl) bodyEl.value = body2;
    copyText(body2, function(ok){ toast(ok ? '복사했습니다 — 메신저에 붙여 넣어 주세요' : '복사가 막혔습니다 — 아래 글을 길게 눌러 복사해 주세요'); });
    return;
  }
  if (d.act === 'fbback') { fbText = ''; go(fbBack); return; }
  if (d.dex) { dexFocus = d.dex; dexBack = (view === 'scout') ? 'scout' : 'album'; go('album'); return; }
  if (d.dexclub) { dexClub = d.dexclub; render(); return; }
  if (d.dexown) { dexOwned = !dexOwned; render(); return; }
  if (d.act === 'dexback') { var back = dexBack; dexFocus = null; go(back === 'scout' ? 'scout' : 'album'); return; }

  if (d.act === 'scout') return doScout();
  if (d.act === 'scout10') return doScout10();
  if (d.scoutpos !== undefined) return doScout(POSK[+d.scoutpos]);
  if (d.trainthis) { trainPick = d.trainthis; supPick = null;
    if (E.supporterCandidates(G, trainPick).length) go('trainSup'); else { startCamp([]); render(); window.scrollTo(0,0); } return; }
  if (d.pick) { trainPick = d.pick; supPick = null;
    if (E.supporterCandidates(G, trainPick).length) go('trainSup'); else { startCamp([]); render(); window.scrollTo(0,0); } return; }
  if (d.sup) {
    var i = supPick.indexOf(d.sup);
    if (i>=0) supPick.splice(i,1); else if (supPick.length<3) supPick.push(d.sup); else toast('서포터는 최대 3명');
    render(); return;
  }
  if (d.act === 'startcamp') { startCamp(supPick); render(); window.scrollTo(0,0); return; }
  if (d.act === 'coachoff') { coach.on = false; saveCoach(); renderCoach(); toast('코치 안내를 껐습니다. 도움말에서 다시 켤 수 있습니다.'); return; }
  if (d.act === 'coachon') { coach = { on:true, intro:false, done:false }; introPage = 0; saveCoach(); go('home'); return; }
  if (d.act === 'intronext') { introPage++; renderIntro(); return; }
  if (d.act === 'introdone' || d.act === 'introskip') { coach.intro = true; introPage = 0; saveCoach(); render(); return; }
  if (d.choice) return applyChoice(d.choice);
  if (d.auto) return autoRun(d.auto);
  if (d.ltab) { leagueTab = d.ltab; render(); window.scrollTo(0,0); return; }
  if (d.detail) { detailId = d.detail; go('player'); return; }
  if (d.play) return doMatch(d.play);
  if (d.act === 'startseason') {
    E.startSeason(G); save(); toast('시즌이 시작됐습니다'); go('match'); return;
  }
  if (d.act === 'advance') return doAdvance();
  if (d.act === 'po') return doPlayoff();
  if (d.act === 'settle') { lastSettle = E.finishSeason(G); save(); checkMissions(); go('settle'); return; }
  if (d.act === 'nextseason') { E.startSeason(G); lastSettle = null; save(); toast('새 시즌이 시작됐습니다'); go('match'); return; }
  if (d.mv) {
    if (d.mv === 'intro') { clearTimeout(introTimer); hideIntro(); if (mv && mv.playing && cr) cr.play(); return; }
    if (d.mv === 'play') {
      mv.playing = !mv.playing;
      document.getElementById('lvPlay').textContent = mv.playing ? '일시정지' : '재생';
      if (mv.playing) { if (cr) cr.play(); } else stopViewer();
    } else if (d.mv === 'speed') {
      mv.speed = mv.speed === 1 ? 2 : (mv.speed === 2 ? 4 : 1);
      if (cr) cr.speed = mv.speed;
      t.textContent = '속도 ' + mv.speed + '배';
    } else if (d.mv === 'figure') {
      FIG = FIG === 'rig' ? 'standee' : 'rig';
      try { localStorage.setItem(FIG_KEY, FIG); } catch(err){}
      if (cr) { cr.figure = FIG; cr.frame(); }
      t.textContent = figLabel();
    } else if (d.mv === 'skipset') skipSet();
    else if (d.mv === 'end') finishViewer();
    return;
  }
  if (d.act === 'help') { stopViewer(); go('help'); return; }
  if (d.fac) {
    try { var up = E.upgradeFacility(G, d.fac); save(); toast(up.name+' '+up.level+'단계 · −'+fmtGold(up.price)+'골드'); }
    catch(err){ toast(err.message); }
    render(); return;
  }
  if (d.report) {
    try { E.buyScoutReport(G, d.report); save(); reportId = d.report; facilityBack = (view==='player') ? 'player' : 'scout'; go('report'); }
    catch(err){ toast(err.message); render(); }
    return;
  }
  if (d.viewreport) { reportId = d.viewreport; facilityBack = (view==='player') ? 'player' : 'scout'; go('report'); return; }
  if (d.act === 'facility-settle') { facilityBack = 'settle'; go('facility'); return; }
  if (d.act === 'autolineup') { E.autoLineup(G); save(); render(); toast('자동 편성했습니다'); return; }
  if (d.act === 'reset') {
    if (!confirm('저장된 진행을 지우고 처음부터 시작할까요?')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch(err){}
    try { localStorage.removeItem(MISSION_KEY); } catch(err2){}
    claimed = {};
    G = newGame();
    coach.on = true; coach.done = false; coachLastKey = null; saveCoach();
    ses=null; feed=[]; lastGrad=lastScout=lastMatch=null; save(); go('home'); return;
  }
});

boot();
})();
</script>
