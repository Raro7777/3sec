<title>블룸 리그 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0A1017; --panel:#131C26; --panel2:#1A2531; --panel3:#22303E;
  --line:#26333F; --line2:#33455A;
  --ink:#E9F0F7; --ink2:#93A6B8; --ink3:#66788A;
  --court:#3E8FE0; --court-bg:#132538;
  --hot:#E9A13B; --hot-bg:#2A2015;
  --good:#4FBF95; --bad:#E3705F;
  --n:#6A7C8E; --r:#5B9BE0; --sr:#A97BE8; --ssr:#E9B949;
  --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.num{font-family:"Barlow Condensed","Gothic A1",sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--court);outline-offset:2px}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(10,16,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:10px 14px 9px;display:flex;align-items:center;gap:10px;
}
.club{font-weight:800;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink2);white-space:nowrap}
.res b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;margin-left:3px}
main{flex:1;padding:14px 14px 108px}
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:520px;margin:0 auto;
  background:rgba(19,28,38,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nav button{
  min-height:var(--tap);padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--ink3);font-weight:500;
}
.nav button .ic{font-size:17px;line-height:1}
.nav button[aria-current="page"]{color:var(--court)}
.nav button[disabled]{opacity:.32}

/* ---------- generic ---------- */
h2{margin:0 0 3px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0 0 16px;color:var(--ink2);font-size:13.5px;line-height:1.55}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.flat{background:var(--panel2)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--ink2);font-size:13px}
.tiny{color:var(--ink3);font-size:12px;line-height:1.5}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:var(--tap);padding:12px 16px;border-radius:10px;
  background:var(--court);color:#06121F;font-weight:800;font-size:15px;
  border:1px solid transparent;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:var(--line2);font-weight:700}
.btn.ghost:active{background:var(--panel3)}
.btn[disabled]{opacity:.4}
.btn+.btn{margin-top:9px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn-row .btn+.btn{margin-top:0}
.pill{
  display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;
  font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.03em;
}
.pos{background:var(--panel3);color:var(--ink2)}
.rar-N{background:rgba(106,124,142,.18);color:var(--n)}
.rar-R{background:rgba(91,155,224,.16);color:var(--r)}
.rar-SR{background:rgba(169,123,232,.18);color:var(--sr)}
.rar-SSR{background:rgba(233,185,73,.18);color:var(--ssr)}
.grade{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px}
.g-S{color:var(--ssr)} .g-A{color:var(--sr)} .g-B{color:var(--r)} .g-C{color:var(--ink2)} .g-D{color:var(--ink3)}

/* ---------- home ---------- */
.hero{
  background:linear-gradient(160deg,var(--court-bg),var(--panel));
  border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:12px;
}
.hero .eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--court);font-weight:600}
.hero h1{margin:2px 0 6px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.stat3 div{background:var(--panel);padding:9px 10px}
.stat3 .v{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;line-height:1.1}
.stat3 .k{font-size:11.5px;color:var(--ink3);margin-top:1px}
.log{margin:0;padding:0;list-style:none}
.log li{font-size:12.5px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line);line-height:1.45}
.log li:last-child{border-bottom:0}

/* ---------- player card ---------- */
.pcard{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;margin-bottom:8px;width:100%;text-align:left}
.pcard.tap{min-height:var(--tap)}
.pcard.sel{border-color:var(--court);background:var(--court-bg)}
.chip{width:5px;align-self:stretch;border-radius:3px;flex:none;min-height:38px}
.ava{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;display:block;
  border:2px solid var(--line2);background:var(--panel2);line-height:0}
.ava.sm{width:28px;height:28px;border-width:1.5px}
.ava svg,.ava img{display:block;width:100%;height:100%;object-fit:cover}
.emb{flex:none;width:42px;height:42px;display:block;line-height:0}
.emb svg{display:block;width:100%;height:100%}
.cardart{flex:none;line-height:0;border-radius:9px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.cardart svg,.cardart img{display:block}
.cardart img{object-fit:cover}
.pname{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.pmeta{font-size:12px;color:var(--ink3);margin-top:1px}
.agb{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;margin-left:5px}
.povr{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;line-height:1;text-align:right}
.povr small{display:block;font-family:"Gothic A1",sans-serif;font-size:10.5px;font-weight:500;color:var(--ink3);margin-top:2px}

/* ---------- training ---------- */
.camp-head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:11px}
.turnbar{display:flex;gap:3px;margin-top:10px}
.turnbar i{flex:1;height:4px;border-radius:2px;background:var(--panel3)}
.turnbar i.done{background:var(--court)}
.turnbar i.now{background:var(--ink)}
.turnbar i.eval{background:var(--hot)}
.gauge{height:8px;border-radius:4px;background:var(--panel3);overflow:hidden;margin-top:7px}
.gauge span{display:block;height:100%;border-radius:4px;background:var(--court)}
.gauge.hot span{background:var(--hot)}
.zone{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;padding:1px 8px;border-radius:5px;
  background:var(--panel3);color:var(--ink2)}
.zone.hot{background:var(--hot-bg);color:var(--hot)}
.zone.cold{background:rgba(62,143,224,.12);color:var(--court)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:11px}
.st{display:flex;align-items:center;gap:7px;font-size:12.5px}
.st .n{color:var(--ink3);width:42px;flex:none}
.st .b{flex:1;height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;position:relative}
.st .b i{display:block;height:100%;background:var(--ink2);border-radius:3px}
.st .b i.core{background:var(--court)}
.st .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13.5px;width:44px;text-align:right;flex:none}
.st .v em{font-style:normal;color:var(--ink3);font-size:11.5px}

.act{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;text-align:left}
.act:active{background:var(--panel2)}
.act .lbl{font-weight:700;font-size:15px;flex:none;width:62px}
.act .gain{flex:1;font-size:12px;color:var(--ink2);line-height:1.35}
.act .gain b{color:var(--good);font-weight:700}
.act .right{text-align:right;flex:none}
.apt{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--panel3);color:var(--ink2)}
.apt.S,.apt.A{background:rgba(79,191,149,.16);color:var(--good)}
.apt.D,.apt.C{background:rgba(227,112,95,.14);color:var(--bad)}
.risk{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:700;color:var(--hot)}
.fat{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;color:var(--ink3)}
.act.rest{background:var(--panel2)}

.evbox{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:11px}
.evtitle{font-weight:800;font-size:15px;margin-bottom:5px}
.evtext{font-size:13.5px;color:var(--ink2);line-height:1.6}
.feed{margin:11px 0 0;padding:0;list-style:none}
.feed li{font-size:12.5px;color:var(--ink2);padding:7px 10px;background:var(--panel2);border-radius:8px;margin-bottom:6px;line-height:1.5}
.feed li b{color:var(--ink);font-weight:700}
.feed li.ev{border-left:2px solid var(--court)}
.feed li.eval{border-left:2px solid var(--hot)}
.feed li.inj{border-left:2px solid var(--bad)}

/* ---------- match ---------- */
.score{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:16px 14px;margin-bottom:12px;text-align:center}
.score .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.score .tn{font-size:13px;font-weight:700;line-height:1.3}
.score .sets{font-family:"Barlow Condensed",sans-serif;font-size:44px;font-weight:700;line-height:1;letter-spacing:.02em}
.score .setline{margin-top:9px;font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--ink2);letter-spacing:.04em}
.verdict{margin-top:8px;font-weight:800;font-size:15px}
.verdict.w{color:var(--good)} .verdict.l{color:var(--bad)}
.bx{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13px}
.bx:last-child{border-bottom:0}
.bx .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bx .st2{font-family:"Barlow Condensed",sans-serif;font-size:13px;color:var(--ink2);white-space:nowrap}
.bx .pt{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;width:26px;text-align:right}
details{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:10px}
details summary{min-height:var(--tap);display:flex;align-items:center;padding:12px 14px;font-weight:700;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾";margin-left:auto;color:var(--ink3)}
details[open] summary::after{content:"▴"}
.cast{padding:0 14px 14px;font-size:13px;line-height:1.75;color:var(--ink2)}
.cast p{margin:0 0 7px}
.cast .pt{color:var(--hot);font-weight:700}
.cast .rot{color:var(--ink3);font-size:12px}

/* ---------- live match viewer ---------- */
.board{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:11px}
.bteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.bteam{font-size:12.5px;font-weight:700;line-height:1.25;min-width:0}
.bteam.away{text-align:right}
.bserve{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);margin-right:5px;vertical-align:1px}
.bserve.off{background:transparent}
.bscore{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:1;letter-spacing:.02em;white-space:nowrap}
.bsets{display:flex;justify-content:center;gap:6px;margin-top:7px;font-family:"Barlow Condensed",sans-serif;font-size:13px;color:var(--ink3)}
.bsets b{color:var(--ink);font-weight:700}
.bsets .cur{color:var(--court)}

.court{position:relative;width:100%;aspect-ratio:1/1.18;max-height:52vh;margin:0 auto 10px;
  border:1px solid #2E4A63;border-radius:10px;overflow:hidden;background:#0C1620}
.court canvas{display:block;width:100%;height:100%}
.court .hud{position:absolute;left:9px;top:8px;right:9px;display:flex;justify-content:space-between;
  font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.08em;color:rgba(233,240,247,.5);pointer-events:none}
.court .net{position:absolute;left:0;right:0;top:50%;height:0;border-top:3px dashed rgba(233,240,247,.55)}
.court .atk{position:absolute;left:0;right:0;height:0;border-top:1px solid rgba(233,240,247,.18)}
.court .half{position:absolute;left:0;right:0;height:50%;font-family:"Barlow Condensed",sans-serif;
  font-size:11px;letter-spacing:.1em;color:rgba(233,240,247,.3);padding:5px 7px}
.court .half.top{top:0} .court .half.bot{bottom:0;display:flex;align-items:flex-end}
.spot{position:absolute;transform:translate(-50%,-50%);width:44px;text-align:center;pointer-events:none;
  transition:opacity .18s}
.spot .num{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;color:rgba(233,240,247,.45);
  border:1px solid rgba(233,240,247,.18);border-radius:50%;width:22px;height:22px;line-height:20px;margin:0 auto;background:rgba(10,16,23,.4)}
.spot.on .num{color:#06121F;background:var(--ink);border-color:var(--ink)}
.spot.on.home .num{background:var(--court);border-color:var(--court);color:#06121F}
.spot .who{font-size:10px;color:rgba(233,240,247,.75);margin-top:2px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0}
.spot.on .who{opacity:1}
.ball{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFF,#E9B949 62%,#C98B1E);
  box-shadow:0 0 10px rgba(233,185,73,.5);transition:left .38s cubic-bezier(.4,.05,.35,1),top .38s cubic-bezier(.4,.05,.35,1)}
.ball.fast{transition-duration:.16s}
.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;letter-spacing:.04em;
  padding:5px 16px;border-radius:8px;background:rgba(10,16,23,.86);opacity:0;transition:opacity .16s}
.flash.show{opacity:1}
.flash.home{color:var(--court);border:1px solid var(--court)}
.flash.away{color:var(--bad);border:1px solid var(--bad)}
.flash.big{font-size:44px;padding:6px 22px;letter-spacing:.06em}
.flash.up{top:20%;font-size:30px;padding:4px 16px}   /* 컷인이 아래를 차지하면 플래시는 위로 */
.flash small{display:block;font-family:"Gothic A1",sans-serif;font-size:12px;font-weight:700;letter-spacing:0;color:var(--ink2);margin-top:-2px}
.flash .streak{display:block;font-size:14px;letter-spacing:.12em;color:var(--hot);margin-top:1px}
@media (prefers-reduced-motion:no-preference){
  .flash.show{animation:flashin .22s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes flashin{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
}
.setb{position:absolute;left:0;right:0;top:38%;padding:10px 0;text-align:center;background:rgba(10,16,23,.9);border-top:2px solid var(--ssr);border-bottom:2px solid var(--ssr);
  font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;letter-spacing:.08em;color:var(--ink);opacity:0;pointer-events:none;transform:translateX(-110%)}
.setb small{display:block;font-family:"Gothic A1",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--ink2)}
.setb.to{border-color:var(--hot);font-size:22px}
.setb.show{animation:sweep 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sweep{0%{transform:translateX(-110%);opacity:0}18%{transform:translateX(0);opacity:1}78%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
.court.tense::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;box-shadow:inset 0 0 46px rgba(233,161,59,.42)}
@media (prefers-reduced-motion:no-preference){ .court.tense::after{animation:tense 1.1s ease-in-out infinite alternate} @keyframes tense{from{opacity:.45}to{opacity:1}} }
.court .tag{position:absolute;left:50%;top:9px;transform:translateX(-50%);font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;
  padding:2px 10px;border-radius:7px;background:rgba(233,161,59,.92);color:#1A1200;pointer-events:none}
.bscore.pop{animation:scorepop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes scorepop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

.rally{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;min-height:92px}
.rlabel{font-size:11.5px;color:var(--ink3);margin-bottom:7px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.08em}
.touches{display:flex;flex-wrap:wrap;gap:5px}
.tch{display:flex;flex-direction:column;padding:5px 8px;border-radius:7px;background:var(--panel2);
  border:1px solid var(--line);min-width:0}
.tch .tact{font-size:11px;font-weight:700;color:var(--ink2);font-family:"Barlow Condensed",sans-serif;letter-spacing:.03em}
.tch .who2{font-size:12px;font-weight:600;margin-top:1px;white-space:nowrap}
.tch.me{border-color:var(--court);background:var(--court-bg)}
.tch.ok .tact{color:var(--good)} .tch.bad .tact{color:var(--bad)}
.tch:not(.arrow){flex-direction:row;align-items:center;gap:6px}
.tch .tx{display:flex;flex-direction:column;min-width:0}
.tch.arrow{align-self:center;background:none;border:none;color:var(--ink3);padding:0 1px;font-size:12px;justify-content:center}
.skb{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:var(--ssr);
  border-top:1px solid rgba(233,185,73,.28);padding-top:2px;white-space:nowrap}
.rres{margin-top:8px;font-size:13px;font-weight:700}
.rres.h{color:var(--court)} .rres.a{color:var(--bad)}

.ctrl{display:grid;grid-template-columns:1.05fr 1fr 1.25fr .85fr;gap:6px;margin-bottom:11px}
.ctrl button{min-height:46px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);
  font-weight:700;font-size:13px;padding:0 6px;white-space:nowrap}
.ctrl button.pri{background:var(--court);color:#06121F;border-color:transparent}
.ctrl button:active{transform:translateY(1px)}

.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.legend b{color:var(--ink);font-weight:700;white-space:nowrap}
.help-open{width:100%;min-height:40px;border-radius:9px;border:1px dashed var(--line2);color:var(--ink2);
  font-size:13px;font-weight:600;margin-bottom:11px}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.subtabs button{min-height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  font-size:13.5px;font-weight:700;color:var(--ink2)}
.subtabs button[aria-current="page"]{background:var(--court-bg);border-color:var(--court);color:var(--court)}
.md{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel)}

<script>
(function(){
'use strict';
var E = window.VS;
window.BLOOM_UI = { matchStory: function(oppId){ return matchStory(oppId, G && G.league ? E.seasonView(G) : null); } };   // app-test 용 훅(표현 계층)
var SAVE_KEY = 'bloom-manager-save-v1';
var BUILD = '__BUILD__';                 // build.mjs 가 git 해시·날짜로 바꾼다. 소스 그대로면 'dev'
if (BUILD.indexOf('__') === 0) BUILD = 'dev';
var ERR_KEY = 'bloom-errors-v1', META_KEY = 'bloom-meta-v1';
var meta = { firstOpen: 0, opens: 0 };
// 테스터가 "화면이 멈췄어요" 라고 할 때 원인을 같이 받으려면 오류를 게임이 기억해야 한다(피드백 본문에 붙는다).
function rememberError(msg){
  try {
    var arr = JSON.parse(localStorage.getItem(ERR_KEY) || '[]');
    arr.push(new Date().toISOString().slice(0,16) + ' ' + String(msg).slice(0, 160));
    localStorage.setItem(ERR_KEY, JSON.stringify(arr.slice(-3)));
  } catch(e){}
}
window.addEventListener('error', function(ev){ rememberError((ev.message || 'error') + (ev.lineno ? ' @' + ev.lineno : '')); });
window.addEventListener('unhandledrejection', function(ev){ var r = ev.reason; rememberError('promise: ' + (r && r.message ? r.message : String(r))); });

// ---------------------------------------------------------------- state
var G = null;                 // 엔진 게임 상태
var view = 'home';
var ses = null;               // 진행 중 육성 세션
var feed = [];                // 육성 턴 피드
var lastGrad = null, lastScout = null, lastMatch = null, lastPulls = null;
var mySide = 0;   // 이번 경기에서 내 팀이 홈(0)인지 원정(1)인지
var detailId = null;   // 상세 화면에서 보고 있는 인스턴스
var reportId = null;   // 스카우트 리포트 화면의 카드 id
var facilityBack = 'home'; // 시설 화면에서 돌아갈 곳 — 결산 흐름(E.5 ⑭)에서 들어오면 'settle'
var leagueTab = 'now'; // 리그 화면 서브탭: now | sched | stats
// world.md 3절 라이벌 구도
var RIVALS = { t01:'t05', t05:'t01', t02:'t06', t06:'t02', t03:'t04', t04:'t03' };
var lastSettle = null;
var trainPick = null, supPick = null;
// 자동 진행은 수동으로 캠프를 1회 완주해야 열린다(처음부터 자동을 누르면 게임을 이해할 수 없다).
var AUTO_KEY = 'bloom-auto-unlocked-v1';
var SKIP_KEY = 'bloom-skip-unlocked-v1';
var MISSION_KEY = 'bloom-missions-v1';
var autoUnlocked = false, usedAutoThisCamp = false, skipUnlocked = false;
var claimed = {};          // 달성해서 보상을 받은 미션 id
// 코치 가이드 — 테스터 피드백 "게임을 어떻게 하는지 모르겠다" 에 대한 답. 첫 안내 3장 + 상태에서 계산한 "지금 누를 버튼".
var COACH_KEY = 'bloom-coach-v1';
var coach = { on:true, intro:false, done:false };   // on: 배너 표시 · intro: 첫 안내를 봤다 · done: 가이드를 마쳤다(정식 선수 3명 + 경기 1회)
var coachLastKey = null, introPage = 0;

var STARTING_TICKETS = E.ONBOARDING.startingTickets; // 온보딩 시작 티켓 — 엔진(missions.js)에 있어 season-check --app 이 같은 값을 잰다

// ---------------------------------------------------------------- 미션
// 코어 루프를 순서대로 가르치는 온보딩 미션. 표·판정·지급은 엔진(engine/missions.js)에 있고
// 여기서는 화면 모양과 "이미 받은 미션" 저장만 맡는다 — 하네스가 같은 표로 난이도를 잰다.
function reps(){ return E.representatives(G); }
function fillerCount(){ return E.myRoster(G).filter(function(p){ return p.rarity===0; }).length; }
function rewardText(m){
  var parts = [];
  if (m.reward.tickets) parts.push('티켓 +' + m.reward.tickets);
  if (m.reward.gold) parts.push('골드 +' + m.reward.gold);
  if (m.reward.fragments) parts.push('조각 +' + m.reward.fragments);
  return parts.join(' · ');
}
function missionState(){
  return E.missionProgress(G).map(function(x){
    return { m:x.mission, p:x.progress, done:x.done, got:!!claimed[x.mission.id] };
  });
}

 * 컨테이너가 정사각형이라 margin % 는 전부 컨테이너 폭 기준이다 — 세로 오프셋에는 카드 비율(4/3)이 곱해진다.
 */
function artThumb(p, alt){ return artCrop(p, alt, 2.2, 0.15, 1); }

/** 전신 일러스트 배너 — 선수 상세 화면 상단. 없으면 null 을 돌려주고 기존 레이아웃으로 떨어진다. */
function heroBanner(p, name){
  var src = artOf(p, 'hero');
  if (!src) return null;
  return '<div style="position:relative;margin:-14px -14px 14px;overflow:hidden">'+
    '<img src="'+src+'" alt="'+String(name||'').replace(/"/g,'')+'" loading="lazy" decoding="async" '+
      'style="display:block;width:100%;aspect-ratio:3/4;object-fit:cover">'+
    '<div style="position:absolute;inset:auto 0 0 0;height:45%;'+
      'background:linear-gradient(to bottom,rgba(10,16,23,0) 0%,rgba(10,16,23,.75) 60%,var(--bg) 100%)"></div>'+
  '</div>';
}

/** 원형 흉상 초상. */
function portraitSvg(p, size){
  var real = artThumb(p, p.name || '');
  if (real) return real;
  var uid = 'p' + hashId((p.cardId||p.id||'') + (p.instanceId||'')).toString(36);
  var g = personG(p, uid);
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true">'+
    '<defs><clipPath id="c'+uid+'"><circle cx="50" cy="50" r="49"/></clipPath>'+g.bg+'</defs>'+
    '<g clip-path="url(#c'+uid+')"><rect width="100" height="100" fill="url(#g'+uid+')"/>'+g.body+'</g>'+
  '</svg>';
}
function shade(hex, amt){
  var n = parseInt(hex.slice(1),16), r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  var cl=function(v){ return Math.max(0,Math.min(255,v)); };
  return '#'+((1<<24)+(cl(r)<<16)+(cl(g)<<8)+cl(b)).toString(16).slice(1);
}

/** 세로 카드 아트(3:4). 등급 프레임 + 배경 + 초상 + 등번호. */

function boot(){
  E.CLUBS.forEach(function(c){ clubColor[c.id] = c.colors.primary; CLUBC[c.id] = c.colors; });
  E.PLAYERS.forEach(function(p){ APPEAR[p.id] = p.appearance; });
  var raw = null;
  try {
    raw = localStorage.getItem(SAVE_KEY);
    autoUnlocked = localStorage.getItem(AUTO_KEY) === '1';
    skipUnlocked = localStorage.getItem(SKIP_KEY) === '1';
    claimed = JSON.parse(localStorage.getItem(MISSION_KEY) || '{}');
    coach = JSON.parse(localStorage.getItem(COACH_KEY) || 'null') || { on:true, intro:false, done:false };
    meta = JSON.parse(localStorage.getItem(META_KEY) || 'null') || { firstOpen: Date.now(), opens: 0 };
    meta.opens = (meta.opens | 0) + 1;
    localStorage.setItem(META_KEY, JSON.stringify(meta));
  } catch(e){ claimed = {}; }
  if (raw) { try { G = E.loadGame(JSON.parse(raw)); } catch(e){ G = null; } }
  if (!G) { G = newGame(); }
  render();
}
function newGame(){
  var g = E.createGame({ seed: (Date.now() % 100000) | 0, clubName: '새록 스프라우츠' });
  // 초반에 마음껏 뽑아 보도록 티켓을 넉넉히 준다(엔진 기본 지급 + 보너스).
  if (g.tickets < STARTING_TICKETS) g.tickets = STARTING_TICKETS;
  return g;
}
function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(E.saveGame(G))); } catch(e){}
}
function go(v){ if (v !== 'matchLive') stopViewer(); if (v === 'feedback' && view !== 'feedback') fbBack = (view === 'matchLive') ? 'home' : view; view = v; window.scrollTo(0,0); render(); }
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}
function h(html){ return html; }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

var TABS = [

// ---------------------------------------------------------------- 코치 가이드
/** 아직 캠프에 보내지 않은 보유 카드 수. */
function untrainedCount(){
  var trained = {};
  (G.instances || []).forEach(function(i){ trained[i.cardId] = 1; });
  return Object.keys(G.ownedCards || {}).filter(function(cid){
    if (trained[cid]) return false;
    try { return !E.isCardRetired(G, cid); } catch(e){ return true; }
  }).length;
}
/** 캠프에서 코치가 권하는 선택 — 자동(최적) 정책과 같은 규칙. 상태를 바꾸지 않는다. */
function coachRec(){
  if (!ses) return null;
  var o = E.trainingOptions(ses);
  if (o.kind === 'event') { var r = o.options.filter(function(c){ return c.recommended; })[0]; return r ? r.id : null; }
  if (o.kind !== 'action' || o.treating) return null;
  var cfg = ses.cfg;
  if (ses.specialAvailable && ses.injuryProbabilityOf(6) <= cfg.optimalSpecialMaxP) return 'special';
  var best = ses.bestTrainingByEv();
  if (ses.turn < cfg.turns && ses.injuryProbabilityOf(best) > cfg.optimalInjuryThreshold) return 'rest';
  return ['serve','receive','set','spike','block'][best];
}
function coachShowRec(){ return coach.on && !coach.done; }
/** 지금 상태에서 "다음에 누를 버튼" 하나. { key, text(html), sel } 또는 null. */
function coachStep(){
  var owned = Object.keys(G.ownedCards || {}).length;
  var trained = G.trainingCount | 0, played = (G.wins | 0) + (G.losses | 0);
  var untrained = untrainedCount();
  if (trained >= 3 && played >= 1) {
    coach.done = true; saveCoach();
    setTimeout(function(){ toast('코치 안내를 마쳤습니다. 이제부터는 감독실의 "다음 목표"를 따라가세요.'); }, 400);
    return null;
  }
  var pickLine = untrained > 0 ? { key:'pick', text:'아직 캠프에 안 보낸 선수가 있습니다. <b>육성</b> 탭에서 키우세요.', sel:'[data-tab="train"]' } : null;
  // ① 캠프 안
  if (ses) {
    var o = E.trainingOptions(ses);
    if (o.kind === 'event') return { key:'ev'+o.turn, text:'이야기 선택입니다. 마음 가는 쪽을 고르세요. 정답은 없고, <b>추천</b>은 무난한 쪽입니다.', sel:'[data-rec="1"]' };
    if (o.treating) return { key:'treat'+o.turn, text:'부상 치료 턴입니다. 훈련은 못 하고 피로만 회복됩니다. <b>치료하고 다음 턴으로</b>를 누르세요.', sel:'[data-choice="rest"]' };
    if (o.kind === 'action') {
      if (o.turn === 1) {
        var rep1 = null; try { rep1 = E.representativeOf(G, ses.trainee.card.id); } catch(e){}
        if (rep1) return { key:'t1r', text:'재육성입니다. 캠프는 매번 처음부터 시작하고, 졸업 결과가 지금 로스터의 이 선수(OVR '+rep1.ovr.toFixed(1)+')보다 좋을 때만 교체됩니다. <b>추천</b>을 누르세요.', sel:'[data-rec="1"]' };
        return { key:'t1', text:'12턴 동안 훈련을 골라 키웁니다. 초록 글씨가 오르는 능력치, 오른쪽 숫자가 쌓이는 피로입니다. 지금은 <b>추천</b>을 누르세요.', sel:'[data-rec="1"]' };
      }
      if (o.isEvalTurn) return { key:'t'+o.turn, text:'이번 턴 끝에 평가전이 있습니다. 결과가 등급에 반영됩니다. 계속 <b>추천</b>을 따라가면 됩니다.', sel:'[data-rec="1"]' };
      return { key:'t'+o.turn, text:'<b>추천</b>을 따라가면 됩니다. 피로가 45를 넘으면 부상 위험이 생겨 휴식이 추천됩니다.', sel:'[data-rec="1"]' };
    }
    return null;
  }
  // ② 선수가 한 명도 없다
  if (owned === 0) {
    if (view === 'scout') return G.tickets > 0
      ? { key:'pull', text:'<b>스카우트 · 티켓 1</b>을 누르세요. 여섯 구단의 명단에서 신인 한 명이 옵니다.', sel:'[data-act="scout"]' }
      : { key:'nopull', text:'티켓이 없습니다. 감독실 "처음부터 다시"로 새로 시작하세요.', sel:'[data-tab="home"]' };
    return { key:'go-scout', text:'감독님, 먼저 선수가 필요합니다. <b>스카우트</b>로 가세요.', sel: view === 'home' ? '[data-go="scout"]' : '[data-tab="scout"]' };
  }
  // ③ 뽑았지만 아직 한 명도 안 키웠다
  if (trained === 0) {
    if (view === 'scout' && document.querySelector('[data-trainthis]')) return { key:'trainthis', text:'뽑은 선수는 아직 우리 팀이 아닙니다. <b>이 선수 키우기</b>로 12턴 캠프에 보내세요.', sel:'[data-trainthis]' };
    if (view === 'train') return { key:'pick1', text:'키울 선수를 누르세요.', sel:'[data-pick]' };
    if (view === 'trainSup') return { key:'campstart', text:'서포터는 나중에 생깁니다. <b>캠프 시작</b>을 누르세요.', sel:'[data-act="startcamp"]' };
    return { key:'go-train', text:'뽑은 선수를 <b>육성</b> 탭에서 키워야 경기에 나갈 수 있습니다.', sel:'[data-tab="train"]' };
  }
  // ④ 키웠지만 아직 경기를 안 했다
  if (played === 0) {
    if (view === 'trainGrad') return { key:'grad', text:'졸업! 이제 우리 팀 선수입니다. <b>경기하러 가기</b>를 누르세요.', sel:'[data-go="match"]' };
    if (view === 'match') return G.league
      ? { key:'adv', text:'<b>경기 진행</b>을 누르면 오늘 경기를 합니다.', sel:'[data-act="advance"]' }
      : { key:'season', text:'<b>시즌 시작</b>을 누르면 14매치데이 리그가 열립니다. 첫 시즌은 지는 게 정상입니다.', sel:'[data-act="startseason"]' };
    if (view === 'matchLive') return { key:'live', text:'경기 중계입니다. <b>속도</b>로 빨리 볼 수 있고, 끝나면 결과가 나옵니다.', sel:null };
    if (view === 'trainSup' || view === 'train') return { key:'pick2', text:'한 명 더 키워도 좋고, <b>리그</b> 탭에서 바로 경기해도 됩니다.', sel:'[data-tab="match"]' };
    return { key:'go-match', text:'<b>리그</b> 탭에서 경기를 시작하세요.', sel:'[data-tab="match"]' };
  }
  // ⑤ 경기는 했고 정식 선수가 셋이 안 된다 — 여기까지 오면 루프를 안다. 셋을 채우게 한다.
  if (view === 'matchResult') return { key:'result', text:'첫 경기를 치렀습니다. 연습생 대신 정식 선수가 셋은 있어야 이기기 시작합니다. <b>선수 키우러 가기</b>.', sel:'[data-go="train"]' };
  if (view === 'matchLive') return { key:'live2', text:'경기 중계입니다. <b>속도</b>로 빨리 볼 수 있습니다.', sel:null };
  if (view === 'train') return untrained > 0
    ? { key:'pick3', text:'아직 안 키운 선수를 누르세요. 정식 선수 '+trained+'/3.', sel:'[data-pick]' }
    : (G.tickets > 0 ? { key:'more', text:'키울 선수가 없습니다. <b>스카우트</b>에서 한 명 더 뽑으세요.', sel:'[data-tab="scout"]' }
                     : { key:'earn', text:'티켓이 없습니다. <b>리그</b>에서 경기를 이어가세요. 경기마다 조각이 쌓여 12개면 티켓 1장입니다.', sel:'[data-tab="match"]' });
  if (view === 'scout') return G.tickets > 0
    ? { key:'pull2', text:'<b>스카우트</b>로 한 명 더 뽑으세요. 정식 선수 '+trained+'/3.', sel:'[data-act="scout"]' }

          '<div class="tiny" style="margin-top:3px">'+esc(t.effect)+(t.upkeep?' · 유지비 '+fmtGold(t.upkeep)+'/시즌':'')+'</div></div>'+
        '<div style="text-align:right;flex:none"><div class="num" style="font-size:16px;font-weight:700">'+(maxed?'최대':'골드 '+fmtGold(t.price))+'</div>'+

        (maxed ? '' : '<button class="btn'+(warn?' ghost':'')+'" data-fac="'+t.id+'"'+(t.canBuy?'':' disabled')+' style="margin-top:10px">투자 · 골드 '+fmtGold(t.price)+'</button>')+
      '</div>';
    }).join('')+
    '<div class="card"><div class="spread"><div><b>📄 스카우트 리포트</b><div class="tiny" style="margin-top:3px">잠재 OVR·훈련 적성·전성기까지 카드의 속을 봅니다. 카드당 1회 결제, 영구 보관.</div></div>'+
      '<div style="text-align:right;flex:none"><div class="num" style="font-size:16px;font-weight:700">'+(fv.report.cost?'골드 '+fmtGold(fv.report.cost):'무료')+'</div><div class="tiny">보유 '+fv.report.owned+'장</div></div></div>'+
      '<div class="tiny" style="margin-top:6px">정가 '+fmtGold(fv.report.base)+' · 분석실 1단계마다 −180 · <b>5단계에서 무료</b>. 구매는 스카우트 결과·선수 상세에서.</div></div>'+
    (back
      ? '<button class="btn" data-go="settle">결산으로 돌아가기</button>'
      : '<button class="btn ghost" data-go="home">감독실로</button>'));
}
/** ⑮ 리포트 구매/열람 버튼 — 스카우트 결과·선수 상세에서 같은 것을 쓴다. */
function reportButton(cardId, ghost){
  var has = false, cost = 0, can = false;
  try { has = E.hasScoutReport(G, cardId); cost = E.reportCost(G); can = E.canBuyScoutReport(G, cardId); } catch(e){ return ''; }
  if (has) return '<button class="btn ghost" data-viewreport="'+cardId+'" style="margin-top:8px">스카우트 리포트 보기</button>';
  var lv = 0; try { lv = E.facilityLevel(G, 'analysis'); } catch(e){}
  return '<button class="btn'+(ghost?' ghost':'')+'" data-report="'+cardId+'"'+(can?'':' disabled')+' style="margin-top:8px">리포트 보기 · '+(cost?'골드 '+fmtGold(cost):'무료')+'</button>'+
    '<div class="tiny" style="margin-top:4px">분석실 '+lv+'단계 · 단계마다 −180, 5단계에서 무료</div>';
}
/** ⑰ 목록용 배지 — 산 카드는 잠재 OVR, 안 산 카드는 자물쇠. */
function reportBadge(cardId){
  try {
    var r = E.scoutReport(G, cardId);

    return ' <span class="agb" style="color:var(--ink3)">🔒 리포트</span>';
  } catch(e){ return ''; }
}

      '<div class="pmeta">#'+r.jersey+' · '+r.heightCm+'cm · '+r.age+'세'+(r.skill?' · '+esc(r.skill.name):'')+'</div></div></div>'+

      }).join('')+'</div></div>'+
    '<div class="card"><div class="legend">'+

    '</div></div>'+
    '<div class="tiny" style="margin:-4px 0 12px">리포트는 이미 정해진 값을 보여 줄 뿐, 선수를 강하게 만들지 않습니다.</div>'+
    '<button class="btn ghost" data-go="'+(view==='report' && facilityBack==='player' ? 'player' : 'scout')+'">'+(facilityBack==='player'?'선수 상세로':'스카우트로')+'</button>');

function vMissions(){
  var st = missionState();
  var next = st.filter(function(s){ return !s.done; });
  var done = st.filter(function(s){ return s.done; });
  return h('<h2>미션</h2><p class="sub">순서대로 따라가면 게임이 손에 익습니다. 달성하면 골드·조각이 바로 들어옵니다. 조각 '+E.ECONOMY.fragmentsPerTicket+'개는 티켓 1장이 됩니다.</p>'+
    next.map(missionRow).join('')+
    (done.length ? '<div class="muted" style="margin:16px 0 8px">달성 '+done.length+'건</div>'+done.map(missionRow).join('') : '')+
    '<button class="btn ghost" data-go="home">돌아가기</button>');
}
function missionRow(s){
  var pctv = Math.round(Math.min(1, s.p/s.m.goal)*100);
  return '<div class="card" style="padding:12px 13px;'+(s.done?'opacity:.62':'')+'">'+
    '<div class="spread"><b style="font-size:14.5px">'+esc(s.m.title)+'</b>'+
      '<span class="num" style="color:'+(s.done?'var(--good)':'var(--hot)')+';font-size:14px">'+(s.done?'완료':rewardText(s.m))+'</span></div>'+
    '<div class="tiny" style="margin:3px 0 8px">'+esc(s.m.desc)+'</div>'+
    '<div class="gauge"><span style="width:'+pctv+'%;background:'+(s.done?'var(--good)':'var(--court)')+'"></span></div>'+
    '<div class="tiny" style="margin-top:4px">'+s.p+' / '+s.m.goal+'</div>'+
  '</div>';
}
function scoutResult(r){
  var c = r.card, col = clubColor[c.teamId] || '#3E8FE0';
  var club = E.CLUBS.filter(function(x){ return x.id===c.teamId; })[0];
  var ovr = 0; for (var i=0;i<10;i++) ovr += c.stats[i]; ovr /= 10;
  // 카드를 실물 크기로 뒤집어 공개한다(art-pipeline 16.1) — 가챠의 정점에 그림이 있어야 한다.
  return '<div class="card" style="border-color:'+col+';background:linear-gradient(160deg,'+col+'22,var(--panel))">'+
    '<div class="rv rone">'+cardFace(c, r.rarity, { anim:true, eager:true, pend:revealPending,
      tag: r.isDuplicate ? 'dup' : 'new', tagText: r.isDuplicate ? '중복 · 한계돌파' : 'NEW',
      sub: POSK[c.pos]+' · '+(club?club.name:'')+' · OVR '+ovr.toFixed(0) })+'</div>'+
    '<div class="spread"><div class="pname" style="font-size:18px">'+esc(c.name)+' <span class="pill rar-'+r.rarity+'">'+r.rarity+'</span></div>'+
    '<div class="pmeta">#'+c.jersey+' · '+c.heightCm+'cm · '+cardAge(c)+'세'+
      (E.isRookieCard && E.isRookieCard(E.cardById(G, c.id)) ? ' <span class="agb" style="color:var(--good)">신인</span>' : '')   /* isRookieCard(card) — (state, id) 로 부르면 항상 false 라 배지가 안 붙었다 */+'</div></div>'+
    (c.skillName?'<div class="tiny" style="margin-top:6px;color:var(--ssr)">고유 스킬 · '+esc(c.skillName)+'</div>':'')+
    '<div class="stats">'+c.stats.map(function(v,i){
      return '<div class="st"><span class="n">'+STATK[i]+'</span><span class="b"><i style="width:'+v+'%"></i></span><span class="v num">'+v+'</span></div>';
    }).join('')+'</div>'+
    (r.isDuplicate?'<div class="tiny" style="margin-top:9px;color:var(--hot)">중복 → 한계돌파 '+r.limitBreak+'단계 (잠재력 상승) · 조각 '+r.fragments.total+'/3</div>':'')+
    (r.pity.triggered?'<div class="tiny" style="margin-top:5px;color:var(--ssr)">천장 보장 발동</div>':'')+
    '<button class="btn" style="margin-top:12px" data-trainthis="'+c.id+'">이 선수 키우기</button>'+
    reportButton(c.id, true)+
  '</div>';
}

// ---------- 육성: 카드 선택
function vTrain(){
  if (ses) return vTrainTurn();
  var ownedAll = Object.keys(G.ownedCards||{});
  var owned = ownedAll.filter(function(cid){
    try { return !E.isCardRetired(G, cid); } catch(e){ return true; }
  });
  var retiredN = ownedAll.length - owned.length;
  if (!ownedAll.length) return '<h2>육성</h2><div class="empty">아직 보유한 카드가 없습니다.<br>먼저 스카우트로 선수를 데려오세요.</div><button class="btn" data-go="scout">스카우트 하러 가기</button>';
  if (!owned.length) return '<h2>육성</h2><div class="empty">보유한 카드가 모두 은퇴했습니다.<br>스카우트로 새 선수를 데려오세요.</div><button class="btn" data-go="scout">스카우트 하러 가기</button>';
  var trainedN = owned.filter(function(cid){ return !!E.representativeOf(G, cid); }).length;
  return h('<h2>육성</h2><p class="sub">12턴 프리시즌 캠프. 훈련으로 능력치를 올리고, 피로를 관리하며, 평가전 3번을 거쳐 졸업시킵니다. 한 번에 5~10분.</p>'+
    (trainedN ? '<div class="card flat"><div class="tiny"><b style="color:var(--ink2)">재육성</b>은 캠프를 처음부터 다시 도는 것입니다(초기화가 아닙니다). 졸업한 선수는 로스터에 그대로 있고, 새 결과가 더 좋을 때만 교체됩니다. 한계돌파가 있으면 천장이 높아져 더 좋게 나올 수 있습니다.</div></div>' : '')+
    (retiredN ? '<div class="card flat"><div class="tiny">은퇴한 카드 '+retiredN+'장은 목록에서 제외됩니다. 재육성해도 나이는 되돌아가지 않습니다.</div></div>' : '')+
    owned.map(function(cid){
      var c = E.trainingCard(G, cid);
      var rep = E.representativeOf(G, cid);
      var ovr = 0; for (var i=0;i<10;i++) ovr += c.stats[i]; ovr /= 10;
      var col = clubColor[c.teamId]||'#3E8FE0';
      var rar = ['N','R','SR','SSR'][c.rarity];
      return '<button class="pcard tap" data-pick="'+cid+'"><span class="ava" style="border-color:'+col+'">'+portraitSvg(c,44)+'</span>'+
        '<div style="flex:1;min-width:0"><div class="pname">'+esc(c.name)+' <span class="pill pos">'+POSK[c.pos]+'</span> <span class="pill rar-'+rar+'">'+rar+'</span></div>'+
        '<div class="pmeta">'+(rep?'<span style="color:var(--good)">로스터 OVR '+rep.ovr.toFixed(1)+' '+['S','A','B','C','D'][rep.grade]+'</span> · 재육성':'미육성 · 첫 캠프')+
        ((G.ownedCards[cid]||0)>0?' · 한계돌파 '+G.ownedCards[cid]:'')+
        (rep?ageBadge(rep,true):'')+reportBadge(cid)+'</div></div>'+
        '<div class="povr num">'+ovr.toFixed(1)+'<small>캠프 시작</small></div></button>';
    }).join(''));
}

// ---------- 육성: 서포터
function vTrainSup(){
  var cands = E.supporterCandidates(G, trainPick);
  var card = E.trainingCard(G, trainPick);
  if (!cands.length) { startCamp([]); return vTrainTurn(); }
  if (supPick === null) supPick = E.recommendSupporters(G, trainPick);
  return h('<h2>서포터 편성</h2><p class="sub">졸업한 선수를 최대 3명까지 붙이면 훈련 효율이 오릅니다. 추천 편성이 미리 선택돼 있습니다.</p>'+
    '<div class="card flat"><div class="spread"><div><b>'+esc(card.name)+'</b> <span class="pill pos">'+POSK[card.pos]+'</span></div><div class="tiny">캠프 입소</div></div></div>'+
    cands.map(function(s){
      var on = supPick.indexOf(s.id)>=0;
      var col = clubColor[s.clubId]||'#3E8FE0';
      return '<button class="pcard tap'+(on?' sel':'')+'" data-sup="'+s.id+'"><span class="ava" style="border-color:'+col+'">'+portraitSvg(s,44)+'</span>'+
        '<div style="flex:1;min-width:0"><div class="pname">'+esc(s.name)+' <span class="pill pos">'+POSK[s.pos]+'</span></div>'+
        '<div class="pmeta">'+(on?'편성됨':'탭해서 편성')+coachBadge(s)+'</div></div>'+
        '<div class="povr num">'+(on?'✓':'')+'</div></button>';
    }).join('')+
    '<button class="btn" style="margin-top:6px" data-act="startcamp">캠프 시작</button>');
}

/** 은퇴 선수는 코치로 남는다 — 서포터 목록에서 구분. */
function coachBadge(sup){
  try {
    var inst = E.representatives(G).filter(function(i){ return i.instanceId === sup.id; })[0];
    if (!inst) return '';
    var a = E.instanceAgeInfo(G, inst);
    if (a.phase === 'retired') return '<span class="agb" style="color:var(--ssr)">코치</span>';
    if (a.phase === 'decline') return '<span class="agb" style="color:var(--hot)">'+a.age+'세 하락기</span>';
    return '<span class="agb">'+a.age+'세</span>';
  } catch(e){ return ''; }
}

function startCamp(ids){
  ses = E.startTraining(G, trainPick, ids || supPick || []);
  feed = [];
  usedAutoThisCamp = false;
  view = 'trainTurn';
}

/** 재육성 캠프면 "지금 로스터의 그 선수" 를 헤더에 보여 준다 — 캠프 초기치가 로스터 초기화로 보이지 않게. */
function retrainChip(card){
  var rep = null; try { rep = E.representativeOf(G, card.id); } catch(e){}
  if (!rep) return '';
  return '<span class="zone" style="background:rgba(79,191,149,.14);color:var(--good);margin-right:6px" title="졸업 결과가 이보다 좋을 때만 교체">재육성 · 로스터 '+rep.ovr.toFixed(1)+'</span>';
}

// ---------- 육성: 턴
function vTrainTurn(){
  var o = E.trainingOptions(ses);
  if (o.kind === 'graduated') { view='trainGrad'; return vTrainGrad(); }
  var card = ses.trainee.card;
  var pct = Math.min(100, o.fatigue);
  var zoneCls = o.zone===2 ? 'hot' : (o.zone===0 ? 'cold' : '');
  var core = CORE[card.pos] || [];

  var head =
   '<div class="camp-head">'+
     '<div class="spread"><div style="display:flex;align-items:center;gap:10px;min-width:0">'+
       bustBox(card, 'sm' + (o.treating ? ' inj' : ''), 36)+
       '<div style="min-width:0"><b style="font-size:16px">'+esc(card.name)+'</b> <span class="pill pos">'+POSK[card.pos]+'</span>'+
         tagRow(o.personality)+'</div></div>'+
       '<div class="num" style="font-size:19px;flex:none">'+o.ovr.toFixed(1)+' <span style="font-size:12px;color:var(--good)">+'+(o.ovr-o.initialOvr).toFixed(1)+'</span></div></div>'+
     '<div class="turnbar">'+Array.from({length:o.totalTurns},function(_,i){
        var n=i+1, cls = n<o.turn?'done':(n===o.turn?'now':((n%4===0)?'eval':''));
        return '<i class="'+cls+'"></i>'; }).join('')+'</div>'+
     '<div class="spread" style="margin-top:9px">'+
       '<div class="muted">캠프 <b class="num" style="color:var(--ink)">'+o.turn+'/'+o.totalTurns+'</b>'+(o.isEvalTurn?' · <span style="color:var(--hot)">평가전</span>':'')+'</div>'+
       '<div class="row">'+retrainChip(card)+'<span class="zone '+zoneCls+'">'+o.zoneLabel+'</span></div>'+
     '</div>'+
     '<div class="gauge '+(o.zone===2?'hot':'')+'"><span style="width:'+pct+'%"></span></div>'+
     '<div class="spread" style="margin-top:5px"><div class="tiny">피로 '+o.fatigue.toFixed(0)+' · 컨디션 '+o.conditionLabel+' '+o.conditionArrow+'</div>'+
       '<div class="tiny">콤보 ×'+o.combo+' · 힌트 '+o.hints+'</div></div>'+
     '<div class="stats">'+o.stats.map(function(v,i){
        var isCore = core.indexOf(i)>=0;
        return '<div class="st"><span class="n">'+STATK[i]+'</span><span class="b"><i class="'+(isCore?'core':'')+'" style="width:'+(v/o.potential[i]*100)+'%"></i></span>'+
               '<span class="v num">'+v.toFixed(0)+'<em>/'+o.potential[i]+'</em></span></div>';
      }).join('')+'</div>'+
   '</div>';

  var body;
  if (o.kind === 'event') {
    // 스토리 컷은 육성 선수의 상반신, 선배 이벤트는 그 선배의 초상(art-pipeline 16.4)
    var who = card, whoCls = '';
    if (o.event.supporterName) { var sup = repByName(o.event.supporterName); if (sup) who = sup; }
    var recEv = coachShowRec() ? coachRec() : null;
    body = '<div class="evbox vn">'+bustBox(who, whoCls, 56)+'<div class="vt"><div class="evtitle">'+esc(o.event.title)+'</div><div class="evtext">'+esc(o.event.text)+'</div></div></div>'+
      o.options.map(function(c){
        var isRec = recEv !== null && c.id === recEv;
        return '<button class="act" data-choice="'+c.id+'"'+(isRec?' data-rec="1"':'')+'><span class="lbl" style="width:auto;flex:1">'+esc(c.label)+(isRec?'<span class="rec">추천</span>':'')+'</span>'+
          '<span class="right"><span class="tiny">'+esc(c.effect||'')+(c.isBranch?' · 성공 '+Math.round(c.successRate*100)+'%':'')+'</span></span></button>';
      }).join('');
  } else if (o.treating) {
    // 부상 치료 턴 — 훈련 선택지가 모두 잠긴다. 넘길 수단이 없으면 화면이 막히므로 전용 버튼을 둔다.
    body = '<div class="evbox" style="border-color:var(--bad)">'+
      '<div class="evtitle" style="color:var(--bad)">부상 치료 중</div>'+
      '<div class="evtext">이번 턴은 훈련할 수 없습니다. 남은 치료 '+o.treatmentTurnsLeft+'턴. '+
        '피로는 회복되지만 캠프 기간을 그만큼 잃습니다.</div></div>'+
      '<button class="btn" data-choice="rest">치료하고 다음 턴으로</button>';
  } else {
    var rec = coachShowRec() ? coachRec() : null;
    // 처음 보는 사람에게 버튼의 세 가지 표시(초록 능력치·적성 글자·피로 숫자)가 무엇인지 한 줄로.
    body = '<div class="tiny" style="margin:0 2px 8px">초록 글씨 = 이번 훈련으로 오르는 능력치 · S~D = 이 선수의 훈련 적성(S가 최고) · 오른쪽 숫자 = 피로 변화</div>';
    body += o.options.map(function(op){
      if (!op.available) return '';
      var gains = op.expectedGains.map(function(v,i){ return v>0.05 ? '<b>'+STATK[i]+'+'+v.toFixed(1)+'</b>' : null; })
                   .filter(Boolean).slice(0,3).join(' ');
      if (op.id==='rest') gains = '피로 회복 · 컨디션 상승 '+Math.round((op.restCondUpP||0)*100)+'%';
      if (op.id==='special') gains = '<b>특훈</b> 큰 상승 · 피로 많이';
      var isRec = rec !== null && op.id === rec;
      return '<button class="act'+(op.id==='rest'?' rest':'')+'" data-choice="'+op.id+'"'+(isRec?' data-rec="1"':'')+'>'+
        '<span class="lbl">'+esc(op.label)+(isRec?'<span class="rec">추천</span>':'')+'</span>'+
        '<span class="gain">'+gains+'</span>'+
        '<span class="right">'+
          (op.hasAptitude?'<span class="apt '+op.aptitudeLabel+'">'+op.aptitudeLabel+'</span> ':'')+
          (op.injuryBadge?'<span class="risk">'+esc(op.injuryBadge)+'</span> ':'')+
          '<span class="fat">'+(op.fatigueDelta>0?'+':'')+op.fatigueDelta.toFixed(0)+'</span>'+
        '</span></button>';
    }).join('');
  }

  var auto = autoUnlocked
    ? '<div class="btn-row" style="margin-top:12px">'+
        '<button class="btn ghost" data-auto="safe">자동 (안전)</button>'+
        '<button class="btn ghost" data-auto="optimal">자동 (최적)</button>'+
      '</div>'
    : '<div class="card flat" style="margin-top:12px"><div class="tiny">'+
        '첫 캠프는 12턴을 직접 진행합니다. 한 번 완주하면 다음부터 <b style="color:var(--ink2)">자동 진행</b>이 열립니다. '+
        '피로가 45를 넘으면 훈련 효율이 1.5배가 되는 대신 부상 위험이 생깁니다 — 각 버튼 오른쪽 숫자를 보세요.'+
      '</div></div>';

  var fd = feed.length ? '<ul class="feed">'+feed.slice(-5).reverse().map(function(f){
      return '<li class="'+(f.cls||'')+'">'+f.html+'</li>'; }).join('')+'</ul>' : '';

  return head + body + auto + fd;
}

/** 재육성이면 기존 대표와 비교해 "로스터가 어떻게 됐는지" 를 한 줄로. 캠프는 매번 처음부터라 이 줄이 없으면 초기화로 보인다. */
function gradCompare(g){
  if (g.prevOvr === null || g.prevOvr === undefined) return '';
  var up = g.ovr - g.prevOvr;
  if (g.kept === 'replaced') return '<div class="card flat" style="margin:12px 0 0;text-align:left"><b style="color:var(--good)">로스터 교체</b>'+
    '<div class="tiny" style="margin-top:3px">기존 대표 OVR '+g.prevOvr.toFixed(1)+' → 이번 결과 '+g.ovr.toFixed(1)+' ('+(up>=0?'+':'')+up.toFixed(1)+'). 더 좋은 쪽이 로스터에 남습니다.</div></div>';
  return '<div class="card flat" style="margin:12px 0 0;text-align:left"><b style="color:var(--hot)">로스터는 그대로</b>'+
    '<div class="tiny" style="margin-top:3px">이번 결과 OVR '+g.ovr.toFixed(1)+'는 기존 대표 '+g.prevOvr.toFixed(1)+'보다 낮아 보관만 했습니다. 캠프는 매번 처음부터 시작하고, 더 좋은 결과가 나올 때만 로스터의 선수가 바뀝니다.</div></div>';
}

/** 통산 기록 카드 — 경기에 나간 적이 없으면 "다음 경기가 데뷔전". */
function careerCard(inst){
  var c = null; try { c = E.careerOf(G, inst.instanceId); } catch(e){}
  if (!c) return '<div class="card flat"><div class="tiny">아직 경기에 나가지 않았습니다. 다음 경기가 데뷔전입니다.</div></div>';
  return '<div class="card"><div class="muted" style="margin-bottom:7px">통산 기록</div><div class="legend">'+
    '<b>경기</b><span>'+c.m+'경기 · '+c.pts+'득점 (한 경기 최다 '+c.best+')</span>'+
    '<b>내역</b><span>공격 '+c.k+' · 블로킹 '+c.b+' · 에이스 '+c.a+' · 디그 '+c.d+'</span>'+
    (c.debut ? '<b>데뷔전</b><span>시즌 '+c.debut.season+' vs '+esc(c.debut.oppName||'')+' · '+(c.debut.won?'승':'패')+' · '+c.debut.pts+'득점</span>' : '')+
  '</div></div>';
}

/** 졸업생이 지금 라인업(선발 6 + 리베로)에 서는가 — 졸업 화면 버튼 문구용. */
function willStart(inst){
  try {
    if (E.careerOf(G, inst.instanceId)) return false;
    var ts = E.myTeamState(G), ids = ts.lineup.startingIds.concat([ts.lineup.liberoId]);
    return ids.indexOf(inst.instanceId) >= 0;
  } catch(e){ return false; }
}

/** 선수 상세의 스카우트 리포트 카드(E.5 ⑮②·⑰). */
function reportCard(cardId){
  var r = null; try { r = E.scoutReport(G, cardId); } catch(e){ return ''; }
  return '<div class="card"><div class="spread"><div class="muted">스카우트 리포트</div>'+
    (r ? '<span class="tiny">잠재 OVR <b style="color:var(--good)">'+r.ovrPotential.toFixed(1)+'</b> · 한계돌파 반영 '+r.ovrPotentialLb.toFixed(1)+'</span>' : '<span class="agb" style="color:var(--ink3)">🔒 없음</span>')+'</div>'+
    reportButton(cardId, !r)+'</div>';
}
/** 선수 상세의 나이·전성기 카드. */
function ageBlock(inst){
  var a;
  try { a = E.instanceAgeInfo(G, inst); } catch(e){ return ''; }
  var msg = a.phase === 'growth' ? '아직 전성기 전입니다.'
    : a.phase === 'peak' ? (a.peakEnd - a.age >= 0 ? '전성기입니다. ' + (a.peakEnd - a.age) + '시즌 뒤부터 하락이 시작됩니다.' : '전성기입니다.')
    : a.phase === 'decline' ? '하락기입니다. 능력치가 '+Math.round((1-a.factor)*100)+'% 깎여 출전합니다. '+(a.retireAt - a.age)+'시즌 뒤 은퇴합니다.'
    : '은퇴했습니다. 코트에는 서지 못하지만 서포터(코치)로 남습니다.';
  var col = a.phase === 'decline' ? 'var(--hot)' : (a.phase === 'retired' ? 'var(--bad)' : 'var(--line2)');
  return '<div class="card" style="border-color:'+col+'">'+
    '<div class="spread"><b>'+a.age+'세 · '+PHASE_KO[a.phase]+'</b>'+
      '<span class="tiny">전성기 ~'+a.peakEnd+'세 · 은퇴 '+a.retireAt+'세</span></div>'+
    '<div class="tiny" style="margin-top:5px;line-height:1.6">'+msg+'</div>'+
  '</div>';
}

// ---------- 로스터
function vRoster(){

    '<button class="btn ghost" style="margin-top:12px" data-go="lineup">라인업 보기</button>');
}

// ---------- 도감 (art-pipeline 16.3) — 런칭 42명 + 데뷔한 신인 전부. 미보유는 실루엣.
var dexClub = 'all', dexOwned = false, dexFocus = null, dexBack = 'album';
function dexTag(c, owned){
  try { if (E.isCardRetired(G, c)) return { tag:'ret', text:'은퇴' }; } catch(e){}
  if (E.isRookieCard(c)) return { tag:'rk', text:'신인' };
  if (owned !== undefined && owned > 0) return { tag:'dup', text:'한계돌파 '+owned };
  return null;
}
function vAlbum(){
  if (dexFocus) return vDexFocus();
  var all = E.allCards(G), own = G.ownedCards || {};
  var nOwn = all.filter(function(c){ return own[c.id] !== undefined; }).length;
  var list = all.filter(function(c){ return (dexClub==='all' || c.teamId===dexClub) && (!dexOwned || own[c.id] !== undefined); });
  var chips = [{ id:'all', n:'전체' }].concat(E.CLUBS.map(function(c){ return { id:c.id, n:c.name.split(' ')[0] }; }));
  return h('<h2>도감</h2><p class="sub">블룸 리그의 모든 선수 카드. 데려온 선수는 컬러로, 아직 만나지 못한 선수는 실루엣으로 보입니다.</p>'+
    '<div class="card flat" style="padding:11px 13px"><div class="spread"><b>보유 '+nOwn+' / '+all.length+'</b>'+
      '<span class="tiny">런칭 42명'+(all.length > 42 ? ' + 신인 '+(all.length-42)+'명' : '')+'</span></div>'+
      '<div class="gauge"><span style="width:'+(all.length ? nOwn/all.length*100 : 0)+'%"></span></div></div>'+
    '<div class="chips">'+chips.map(function(x){
        return '<button data-dexclub="'+x.id+'"'+(dexClub===x.id?' aria-current="page"':'')+'>'+esc(x.n)+'</button>'; }).join('')+
      '<button data-dexown="1"'+(dexOwned?' aria-current="page"':'')+'>보유만</button></div>'+
    (list.length
      ? '<div class="dex">'+list.map(function(c){
          var owned = own[c.id], rar = RARK[c.rarity], t = dexTag(c, owned);
          return '<button class="rbtn" data-dex="'+c.id+'">'+cardFace(c, rar, { off: owned === undefined,
            tag: t ? t.tag : '', tagText: t ? t.text : '', sub: POSK[c.pos]+' · '+rar })+'</button>';
        }).join('')+'</div>'
      : '<div class="empty">해당하는 카드가 없습니다.</div>')+
    '<button class="btn ghost" style="margin-top:12px" data-go="roster">로스터로</button>');
}
function vDexFocus(){
  var c = E.cardById(G, dexFocus);
  if (!c) { dexFocus = null; return vAlbum(); }
  var own = G.ownedCards || {}, owned = own[c.id], has = owned !== undefined;
  var rar = RARK[c.rarity], club = clubOf(c.teamId), rep = E.representativeOf(G, c.id);
  var retired = false; try { retired = E.isCardRetired(G, c); } catch(e){}

// ---------- 선수 B: 성격·인연·서사 (docs/world.md 3·6절, training-mode 6.3·6.4) — 전부 표현 계층, 판정 무관
/** 성격 태그 줄: 아키타입 배지 + 태그. 태그가 없으면 빈 문자열. */
function tagRow(tags){
  if (!tags || !tags.length) return '';
  var arch = E.archetypeOf(tags), ko = (E.ARCHETYPE_KO && E.ARCHETYPE_KO[arch]) || '';
  return '<div class="tagrow">'+(ko ? '<span class="arch">'+esc(ko)+'</span>' : '')+
    tags.slice(0, 3).map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('')+'</div>';
}
/** 나이 단계에 따른 초상 상태 클래스(하락기 채도↓ · 은퇴 흑백 · 전성기 금테). 그림 없이 CSS 필터로. */
function phaseClass(inst){
  var a; try { a = E.instanceAgeInfo(G, inst); } catch(e){ return ''; }
  return a.phase === 'retired' ? ' gray' : (a.phase === 'decline' ? ' decline' : (a.phase === 'peak' ? ' peak' : ''));
}
/** 상반신 상자. 그림이 없으면 원형 초상으로 대신한다. */
function bustBox(p, cls, size){
  var b = artBust(p, p && p.name);
  if (b) return '<span class="bust '+(cls||'')+'">'+b+'</span>';
  return '<span class="ava" style="width:'+(size||44)+'px;height:'+(size||44)+'px">'+portraitSvg(p, size||44)+'</span>';
}
/** 인스턴스 이름으로 대표 찾기(서포터·MVP 표시용). */
function repByName(name){
  try { return E.representatives(G).filter(function(i){ return i.name === name; })[0] || null; } catch(e){ return null; }
}
/**
 * 경기 전 서사 한두 줄 — 친정 대결 · 숙적 · 선두 다툼 · 이번 시즌 전적. 있는 데이터(원소속 구단, 라이벌 표, 순위, 일정)만 쓴다.
 */
function matchStory(oppId, sv){
  var lines = [];
  var club = clubOf(oppId); if (!club) return lines;
  var cname = club.name.split(' ')[0];
  var reps = []; try { reps = E.representatives(G).filter(function(i){ try { return E.instanceAgeInfo(G, i).phase !== 'retired'; } catch(e){ return true; } }); } catch(e){}
  var home = reps.filter(function(i){ return i.clubId === oppId; });
  if (home.length) lines.push(E.josa(home.slice(0, 2).map(function(i){ return i.name; }).join('·'), '', '') + '의 친정 ' + E.josa(cname, '과', '와') + '의 경기입니다.');
  var rivalOf = RIVALS[oppId];
  var foe = reps.filter(function(i){ return i.clubId === rivalOf; });
  if (foe.length) { var oc = clubOf(rivalOf); lines.push(foe[0].name + '에게 ' + E.josa(cname, '은', '는') + ' 원소속 ' + (oc ? oc.name.split(' ')[0] : '') + '의 숙적입니다.'); }
  if (sv && sv.standings && sv.matchday > 0) {
    var me = sv.standings.filter(function(r){ return r.isMe; })[0], op = sv.standings.filter(function(r){ return r.teamId === oppId; })[0];
    if (me && op) {
      if (me.rank <= 2 && op.rank <= 2) lines.push('선두 다툼입니다. ' + me.rank + '위와 ' + op.rank + '위의 맞대결.');
      else if (Math.abs(me.rank - op.rank) === 1) lines.push('순위표에서 바로 ' + (op.rank < me.rank ? '위' : '아래') + ' 팀입니다. 이기면 자리가 바뀝니다.');
    }
    var w = 0, l = 0;
    try { E.schedule(G).forEach(function(md){ var f = md.mine; if (!f || !f.result) return; if (f.home !== oppId && f.away !== oppId) return;
      var mineHome = f.home === G.clubId; var won = mineHome ? f.result.homeSets > f.result.awaySets : f.result.awaySets > f.result.homeSets; if (won) w++; else l++; }); } catch(e){}
    if (w + l) lines.push('이번 시즌 ' + E.josa(cname, '과', '와') + ' ' + w + '승 ' + l + '패.');
  }
  return lines.slice(0, 2);
}

/** ⑱ 계약 선수 수 게이지 — 무료 슬롯을 넘으면 초과 인원당 운영비가 붙는다. */
function squadGauge(){
  var n = 0, free = 42, per = 200;
  try { n = E.squadSize(G); free = E.FACILITY.squadFreeSlots; per = E.FACILITY.squadUpkeepPerPlayer; } catch(e){ return ''; }
  var over = Math.max(0, n - free);
  return '<div class="card flat" style="padding:11px 13px"><div class="spread"><b>계약 '+n+'/'+free+'</b><span class="tiny">'+(over?'초과 '+over+'명 × '+per+' = 시즌 운영비 '+fmtGold(over*per):'무료 슬롯')+'</span></div>'+
    '<div class="gauge'+(over?' hot':'')+'"><span style="width:'+Math.min(100, n/free*100)+'%"></span></div>'+
    '<div class="tiny" style="margin-top:5px">'+free+'명을 넘으면 1명당 '+per+'골드가 시즌마다 붙습니다.</div></div>';
}
function vLineup(){
  var ts = E.myTeamState(G);
  var slots = ['S (서버)','OH 1','MB 1','OP','OH 2','MB 2'];
  var starters = ts.lineup.startingIds.map(function(id){ return ts.index.get(id); });
  var lib = ts.index.get(ts.lineup.liberoId);
  return h('<h2>라인업</h2><p class="sub">표준 5-1 자동 편성입니다. 로테이션 순서대로 코트에 섭니다. 라인업 OVR '+E.lineupOvr(G).toFixed(1)+'.</p>'+
    starters.map(function(p,i){
      return '<div class="pcard"><span class="ava" style="border-color:'+(clubColor[p.teamId]||'var(--n)')+'">'+portraitSvg(p,40)+'</span>'+
        '<div style="flex:1;min-width:0"><div class="pname" style="font-size:14.5px">'+esc(p.name)+'</div>'+
        '<div class="pmeta">'+slots[i]+lineupAgeWarn(p)+'</div></div>'+
        '<div class="povr num" style="font-size:15px">'+POSK[p.pos]+'</div></div>';
    }).join('')+
    (lib?'<div class="pcard"><span class="ava" style="border-color:'+(clubColor[lib.teamId]||'var(--n)')+'">'+portraitSvg(lib,40)+'</span>'+
      '<div style="flex:1"><div class="pname" style="font-size:14.5px">'+esc(lib.name)+'</div><div class="pmeta">리베로 (후위 전담)</div></div>'+
      '<div class="povr num" style="font-size:15px">L</div></div>':'')+
    '<button class="btn ghost" data-act="autolineup">자동 편성 다시</button>');
}

// ---------- 리그 (시즌)
function vLeague(){
  var sv = G.league ? E.seasonView(G) : null;
  if (!sv) {
    return h('<h2>리그</h2><p class="sub">블룸 리그는 7팀이 14매치데이 동안 맞붙습니다. 매치데이마다 육성을 한 번 하고 경기를 치르며, 상위 4팀이 포스트시즌에 갑니다.</p>'+
      '<div class="card"><div class="legend">'+
        '<b>정규 시즌</b><span>팀당 12경기. 3-0·3-1 승리는 승점 3, 3-2 승리는 2, 2-3 패배는 1점.</span>'+
        '<b>포스트시즌</b><span>4위와 3위가 단판, 승자가 2위와 3전2선승, 그 승자가 1위와 5전3선승. 정규 1위는 1승을 안고 시작합니다.</span>'+
        '<b>다음 시즌</b><span>여섯 구단도 함께 성장합니다. 로스터를 계속 키우지 않으면 순위가 밀립니다.</span>'+
      '</div></div>'+
      '<button class="btn" data-act="startseason">시즌 1 시작</button>'+
      '<div class="tiny" style="margin-top:14px">연습 삼아 한 경기만 해보려면 아래에서 상대를 고르세요.</div>'+
      friendlyList());
  }
  if (sv.phase === 'offseason') return vSettle();
  if (sv.phase === 'playoff') return vPlayoff();

  var head = leagueHeader(sv) +
    '<div class="subtabs">'+
      ['now:이번 매치데이','sched:일정','stats:기록'].map(function(x){

function leagueHeader(sv){

     '<div class="spread"><div class="eyebrow" style="font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.14em;color:var(--court);font-size:12px">SEASON '+sv.season+'</div>'+
       '<div class="tiny">매치데이 '+sv.matchday+' / '+sv.totalMatchdays+' · 상대 성장 '+Math.round(sv.growth*100)+'%</div></div>'+
     '<div class="stat3" style="margin-top:10px">'+
       '<div><div class="v num">'+(me?me.rank:'-')+'위</div><div class="k">현재 순위</div></div>'+
       '<div><div class="v num">'+(me?me.wins+'-'+me.losses:'0-0')+'</div><div class="k">승패</div></div>'+
       '<div><div class="v num">'+(me?me.points:0)+'</div><div class="k">승점</div></div>'+

function vSchedule(sv){

// ---------- 리그: 개인 기록 · 지난 시즌
function vLeagueStats(sv){
  var ps = (G.league && G.league.playerStats) || {};
  var list = Object.keys(ps).map(function(k){ return ps[k]; });
  var cats = [
    { k:'points', n:'득점', f:function(r){ return r.points; } },
    { k:'kills', n:'공격 성공', f:function(r){ return r.kills; } },
    { k:'blockKills', n:'블로킹', f:function(r){ return r.blockKills; } },
    { k:'aces', n:'서브 에이스', f:function(r){ return r.aces; } },
    { k:'digs', n:'디그', f:function(r){ return r.digs; } }
  ];
  var hist = E.seasonHistory(G);
  var body = list.length
    ? cats.map(function(c){
        var top = list.slice().sort(function(a,b){ return c.f(b)-c.f(a); }).slice(0,5).filter(function(r){ return c.f(r)>0; });
        if (!top.length) return '';
        return '<div class="card" style="padding:4px 2px">'+
          '<div class="muted" style="padding:8px 10px 4px">'+c.n+' 순위</div>'+
          top.map(function(r,i){
            var mine = r.teamId === G.clubId;
            return '<div class="bx"'+(mine?' style="background:var(--court-bg)"':'')+'>'+
              '<span class="pt" style="width:18px;color:var(--ink3)">'+(i+1)+'</span>'+
              '<span class="pill pos">'+r.positionCode+'</span>'+
              '<span class="nm"'+(mine?' style="color:var(--court)"':'')+'>'+esc(r.name)+'</span>'+
              '<span class="st2">'+esc(mine?G.clubName:(E.CLUBS.filter(function(x){return x.id===r.teamId;})[0]||{}).name||'')+'</span>'+
              '<span class="pt">'+c.f(r)+'</span></div>';
          }).join('')+
        '</div>';
      }).join('')
    : '<div class="empty">아직 경기 기록이 없습니다.<br>매치데이를 진행하면 리그 전체 선수의 기록이 쌓입니다.</div>';

  var histBlock = hist.length
    ? '<div class="card" style="padding:4px 2px"><div class="muted" style="padding:8px 10px 4px">지난 시즌</div>'+
        hist.slice().reverse().map(function(x){
          return '<div class="bx"><span class="pt" style="width:26px;color:var(--ink3)">S'+x.season+'</span>'+
            '<span class="nm">'+x.rank+'위 · '+x.wins+'승 '+x.losses+'패'+(x.champion?' <span style="color:var(--ssr)">우승</span>':'')+'</span>'+
            '<span class="st2">'+esc(x.championName||'')+' 우승</span></div>';
        }).join('')+
      '</div>'
    : '';
  return body + histBlock;
}


function standingsTable(rows){

        '<span class="pt" style="width:20px;color:'+(r.isMe?'var(--court)':'var(--ink3)')+'">'+r.rank+'</span>'+

function friendlyList(){

/** ⑬ 결산 5b — 운영비 정산. 보상 뒤에 빨간 −금액 줄. 미납이면 강등을 반드시 노출한다. */
function upkeepBlock(st){
  var u = st && st.upkeep;
  if (!u || !u.total) return '';
  var name = '';
  if (u.demoted) { try { name = (E.FACILITY.tracks.filter(function(t){ return t.id===u.demoted; })[0]||{}).name || u.demoted; } catch(e){ name = u.demoted; } }
  var lvNow = 0; if (u.demoted) { try { lvNow = E.facilityLevel(G, u.demoted); } catch(e){} }
  return '<div class="card" style="border-color:'+(u.shortfall>0?'var(--bad)':'var(--line2)')+'">'+
    '<div class="spread"><b>구단 운영비</b><b class="num" style="color:var(--bad)">−'+fmtGold(u.paid)+'</b></div>'+
    '<div class="tiny" style="margin-top:4px">시설 '+u.levels+'단계 × '+fmtGold(u.perLevel)+' = '+fmtGold(u.facility)+(u.squad?' · 계약 '+u.squadSize+'명 중 초과 '+u.over+'명 × '+fmtGold(u.perPlayer)+' = '+fmtGold(u.squad):' · 선수단 초과 없음')+'</div>'+
    (u.shortfall>0 ? '<div style="margin-top:8px;color:var(--bad);font-weight:700">미납 '+fmtGold(u.shortfall)+' — '+esc(name)+' 이 '+lvNow+'단계로 내려갔습니다</div>' : '')+
  '</div>';
}
/** ⑭ 결산 5c — 구단에 투자. 결산에서 남는 돈을 구단에 넣는 리듬(B.6.4). */
function investBlock(){
  var fv; try { fv = E.facilityView(G); } catch(e){ return ''; }
  var any = fv.tracks.some(function(t){ return t.price !== null; });
  if (!any) return '';
  return '<div class="card"><div class="spread"><div><b>구단에 투자</b> '+prestigeBadge()+'<div class="tiny" style="margin-top:3px">골드 '+fmtGold(fv.gold)+' · 예비비 '+fmtGold(fv.reserve)+' 를 빼면 <b>'+fmtGold(fv.spendable)+'</b> 을 쓸 수 있습니다</div></div></div>'+
    '<button class="btn ghost" data-act="facility-settle" style="margin-top:10px">시설 보기</button></div>';
}
/** 시즌 MVP — 전신(hero)이 있으면 배너로, 없으면 카드 상단 크롭. (art-pipeline 16.4) */
function mvpBlock(mvp){
  var p = null;
  try {
    p = E.representatives(G).filter(function(i){ return i.instanceId === mvp.playerId; })[0] || E.cardById(G, mvp.playerId);
    if (!p && mvp.teamId && mvp.teamId !== G.clubId) p = E.clubTeamState(G, mvp.teamId).roster.filter(function(x){ return x.id === mvp.playerId; })[0] || null;
    if (!p) p = E.myRoster(G).filter(function(x){ return x.id === mvp.playerId; })[0] || null;
  } catch(e){}
  var src = p ? (artOf(p, 'hero') || artOf(p, 'card')) : null;
  return '<div class="card"><div class="spread"><div class="muted">시즌 MVP</div><div class="tiny">'+esc(mvp.teamName||'')+'</div></div>'+
    (src ? '<div class="mvpb"><img src="'+src+'" alt="" loading="lazy" decoding="async"><div class="cap">'+esc(mvp.playerName)+'<small>SEASON MVP · '+(mvp.value||0)+'득점</small></div></div>'
         : '<div class="pname" style="margin-top:4px">'+esc(mvp.playerName)+'</div>')+
  '</div>';
}
/** 결산에서 새로 명단에 오르는 신인 세대 — 드래프트 카드 공개(2열, 차례 뒤집기). 그림을 먼저 디코드한 뒤 뒤집는다(16.1). */
var draftReady = {};
function rookieBlock(st){
  var list = st && st.rookies;
  if (!list || !list.length) return '';

  '</div>';
}

/** 결산에서 이번에 은퇴하는(또는 이미 은퇴한) 선수를 헌액한다. */

          // 전당이 있으면 카드 벽(세피아 톤) — 시설 등급의 보이는 보상(E.5 ⑲ · art-pipeline 16.4)
          ? '<div class="dex">'+list.map(function(i){

            }).join('')+'</div>'

      : '')+
    (soon.length
      ? '<div class="muted" style="margin:'+(list.length?'12px':'0')+' 0 7px">다음 시즌 은퇴 예정</div>'+

/** ⑲ 명예의 전당 등급 표시 — 등급이 있으면 헌액 규모로 읽힌다(외형). */

// ---------- 라이브 경기 뷰어 ----------
// 이벤트 로그를 랠리 단위로 묶어, 코트 위에서 공이 오가는 것을 보여준다.
var EVN = { 3:'서브', 4:'리시브', 5:'토스', 6:'공격', 7:'블로킹', 8:'디그', 9:'커버', 10:'프리볼' };
var ATKN = { 1:'속공', 2:'오픈', 3:'후위공격', 4:'시간차', 5:'세터 덤프', 6:'프리볼' };
var QN = { 1:'정확', 2:'무난', 3:'흔들림', 4:'실패' };
var OUTN = { 2:'서브 에이스', 3:'강타 득점', 4:'범실', 5:'블로킹 득점', 6:'블록 터치', 7:'블록 아웃 득점', 8:'디그로 살림' };

// 코트 좌표: 홈(내 팀)은 아래, 원정은 위. 로테이션 번호 1~6.
function spotXY(side, pos, isServe){
  var home = (side === 0);
  var x = (pos===4||pos===5) ? 0.22 : (pos===3||pos===6) ? 0.5 : 0.78;
  var front = (pos===2||pos===3||pos===4);
  var y;
  if (isServe) y = home ? 0.955 : 0.045;
  else if (home) y = front ? 0.615 : 0.845;
  else y = front ? 0.385 : 0.155;
  return { x:x*100, y:y*100 };
}

function buildRallies(m){
  var rallies = [], cur = null, pendingTO = null;
  var hs = 0, as = 0;
  m.events.forEach(function(e){
    if (e.type === 18) { pendingTO = { side:e.side, streak:e.value }; return; }   // 작전타임 → 다음 랠리 앞에 띄운다
    if (e.type === 2) {
      // 코트 위 12명(자리 1~6 순) — 공을 안 만진 선수도 스탠디로 세운다(art-pipeline 16.8)
      var lineup = e.lineup ? e.lineup.map(function(ids){ return ids.map(function(id){ var q = m.ctx.players[id]; return q ? { id:id, name:q.name, jersey:q.jersey } : { id:id, name:'', jersey:0 }; }); }) : null;
      cur = { set:e.set, touches:[], point:null, before:[hs,as], skills:[], timeout: pendingTO, lineup: lineup }; pendingTO = null; rallies.push(cur); return;
    }
    if (!cur) return;
    if (e.type === 11) {
      cur.point = { side:e.side, reason:e.reason, clutch:e.clutch, home:e.homeScore, away:e.awayScore };
      hs = e.homeScore; as = e.awayScore; cur = null; return;
    }
    if (e.type >= 3 && e.type <= 10) {
      var p = m.ctx.players[e.playerId];
      cur.touches.push({
        side:e.side, type:e.type, pos:e.courtPosition || 3,
        name: p ? p.name : '', jersey: p ? p.jersey : 0, playerId: e.playerId, player: p || null,
        quality:e.quality, outcome:e.outcome, attackType:e.attackType,
        isServe: e.type === 3,
        skills: e.skills || null
      });
      if (e.skills) for (var si=0; si<e.skills.length; si++) cur.skills.push(e.skills[si]);
    }
  });
  return rallies.filter(function(r){ return r.touches.length && r.point; });
}

var mv = null;   // { rallies, ri, playing, speed, done }
var cr = null;   // 코트 렌더러
// 코트 그림 방식(art-pipeline 16.9): 'rig'(공용 바디 리그, 기본) | 'standee'(전신 누끼). 경기 화면 버튼으로 바꾸고 기억한다.
var FIG_KEY = 'bloom-figure-v1';
var FIG = 'rig';
try { var _f = localStorage.getItem(FIG_KEY); if (_f === 'standee' || _f === 'rig') FIG = _f; } catch(e){}
function figLabel(){ return FIG === 'rig' ? '그림: 리그' : '그림: 스탠디'; }
/** 리그 머리(16.9): 선수 → {face(카드 원형 비트맵), hair:[팔레트, 스타일], skin, type(체형 S/M/L)}. 그림 정보는 빌드가 h 로 실어 준다. */
function headInfo(p, onReady){
  var k = artKey(p), e = k ? window.BLOOM_ART[k] : null;
  var h = (e && e.h) || [2, 'short', 'A'];
  var hc = p.heightCm || 0, type = hc && hc <= 172 ? 'S' : (hc >= 182 ? 'L' : 'M');
  return { face: faceBitmap(p, onReady), hair: [h[0], h[1]], skin: h[2], type: type };
}
// 검사용 훅(art-test 16.8): 스크립트 지역 변수라 밖에서 못 보므로 코트 렌더러만 내준다. 게임 로직은 쓰지 않는다.
window.BLOOM_DEBUG = { court: function(){ return cr; } };

function startViewer(){
  mv = { rallies: buildRallies(lastMatch), ri:0, ti:-1, playing:true, speed:1, done:false };
  view = 'matchLive'; render();
}
function stopViewer(){ if (cr) cr.pause(); if (mv) mv.playing = false; }

/** 캔버스를 붙이고 현재 랠리를 재생한다. */
function mountCourt(){
  var cv = document.getElementById('lvCanvas');
  if (!cv || !mv) return;
  var m = lastMatch;
  var crowd = 0; try { crowd = E.facilityLevel(G, 'stadium') / 5; } catch(e){}
  cr = CourtRender.create(cv, { colors:{ home:'#5FB0FF', away:'#F09080' }, crowd: crowd });   // ⑲ 홈구장 등급 → 관중 밀도(외형)
  cr.mySide = mySide;
  cr.speed = mv.speed;
  cr.onTouch = function(i){ paintLive(i); };
  cr.onEnd = function(){ nextRally(); };
  // 코트 얼굴 마커(art-pipeline 16.2): 선수 id → 64px 원형 비트맵. 처음 디코드가 끝나면 정지 프레임을 한 번 다시 그린다.
  var players = m.ctx.players;
  cr.faceOf = function(pid){ var p = players[pid]; return p ? faceBitmap(p, function(){ if (cr && mv && !mv.playing) cr.frame(); }) : null; };
  // 스탠디(16.8): 누끼 전신이 있는 선수는 실루엣 대신 그림으로 선다
  cr.standOf = function(pid){ var p = players[pid]; return p ? standBitmap(p, function(){ if (cr && mv && !mv.playing) cr.frame(); }) : null; };

/** 흐름 기록 — 작전타임 횟수와 최장 연속 득점. 흐름 모델이 꺼져 있으면 빈 문자열. */
function flowLine(m){
  var f = m.flow; if (!f) return '';
  var me = mySide, op = 1 - mySide;
  return '<div class="card flat"><div class="tiny">흐름 · 최장 연속 득점 우리 '+(f.maxStreak[me]|0)+' / 상대 '+(f.maxStreak[op]|0)+
    ' · 작전타임 우리 '+(f.timeouts[me]|0)+'회 / 상대 '+(f.timeouts[op]|0)+'회</div></div>';
}
/** 오늘 코트에서 한 일 한 마디 — 가장 큰 항목. */
function deedText(b){
  var k = b.kills|0, bl = b.blockKills|0, a = b.aces|0, d = b.digs|0;
  if (k >= bl && k >= a && k > 0) return '공격 득점 ' + k;
  if (bl >= a && bl > 0) return '블로킹 ' + bl;
  if (a > 0) return '에이스 ' + a;
  if (d > 0) return '디그 ' + d;
  return '득점 ' + (b.points|0);
}
/**
 * 육성→코트 연결 연출의 결과 화면 몫: ① 데뷔전 카드 ② "캠프의 흔적"(오늘 기록 옆에 캠프에서 올린 그 능력치) ③ 통산 첫 기록.
 * 전부 recordCareer 가 준 view.career 와 인스턴스의 initial/finalStats 만 읽는다.
 */
function careerBlocks(m){
  var cr = m.career; if (!cr) return '';
  var byId = {}; E.representatives(G).forEach(function(i){ byId[i.instanceId] = i; });
  var box = m.box.mine || [], debut = debutSet(m), html = '';
  Object.keys(debut).forEach(function(id){
    var inst = byId[id], b = box.filter(function(x){ return x.playerId === id; })[0];
    if (!inst || !b) return;
    var tr = E.campTrace(inst, b);
    html += '<div class="card" style="border-color:var(--ssr)"><div class="spread"><b style="color:var(--ssr)">데뷔전</b>'+
      '<span class="tiny">'+(m.won?'승리':'패배')+' · vs '+esc(m.opponent.name)+'</span></div>'+
      '<div style="display:flex;gap:12px;align-items:center;margin-top:9px">'+
        '<span class="avw"><span class="ava" style="width:52px;height:52px">'+portraitSvg(inst, 52)+'</span></span>'+
        '<div style="flex:1;min-width:0"><div class="pname">'+esc(inst.name)+' <span class="pill pos">'+POSK[inst.pos]+'</span></div>'+
        '<div class="tiny" style="margin-top:3px">'+b.points+'득점 · 공격 '+b.kills+'/'+b.attacks+' · 블로킹 '+b.blockKills+' · 에이스 '+b.aces+' · 디그 '+b.digs+'</div>'+
        (tr ? '<div class="tiny" style="margin-top:3px;color:var(--good)">캠프에서 '+STATK[tr.stat]+' '+tr.from+'→'+tr.to+' (+'+tr.delta+') → 오늘 '+deedText(b)+'</div>'
            : '<div class="tiny" style="margin-top:3px">'+(b.points>0 ? '첫 경기부터 득점판에 이름을 올렸다.' : '득점은 없었지만 코트에 섰다. 다음 캠프가 답이다.')+'</div>')+
      '</div></div></div>';
  });
  var rows = box.filter(function(b){ return byId[b.playerId] && !debut[b.playerId]; }).slice(0, 3).map(function(b){
    var inst = byId[b.playerId], tr = E.campTrace(inst, b);
    if (!tr) return '';
    return '<div class="bx"><span class="ava sm">'+portraitSvg(inst, 28)+'</span><span class="nm">'+esc(b.name)+'</span>'+
      '<span class="st2">'+deedText(b)+' ← 캠프 '+STATK[tr.stat]+' '+tr.from+'→'+tr.to+'</span></div>';
  }).filter(Boolean);
  if (rows.length) html += '<div class="card" style="padding:4px 2px"><div class="muted" style="padding:8px 10px 4px">캠프의 흔적 — 오늘 코트에 보인 훈련</div>'+rows.join('')+'</div>';
  if (cr.firsts && cr.firsts.length) html += '<div class="card flat"><div class="tiny">'+cr.firsts.map(function(f){ return '🎉 '+esc(f.name)+' — '+esc(f.what); }).join('<br>')+'</div></div>';
  return html;
}

function applyChoice(id){
  var res = E.applyTrainingChoice(ses, id);
  (res.events||[]).forEach(function(ev){ pushFeed(ev); });
  var o = E.trainingOptions(ses);
  if (o.kind === 'graduated') finishCamp();
  else render();
}

function pushFeed(ev){
  var cls = '', html = '';
  if (ev.type === 'turn') {
    var g = (ev.gains||[]).map(function(x){ return STATK[x.stat]+' +'+x.value.toFixed(1); }).join(', ');
    html = '<b>'+esc(ev.actionLabel||'')+'</b> ' + esc(g) +
           ' <span style="color:var(--ink3)">· 피로 '+ev.fatigue[0].toFixed(0)+'→'+ev.fatigue[1].toFixed(0)+'</span>' +
           (ev.flavor ? ' — '+esc(ev.flavor) : '');
    if (ev.injuryLabel) { cls='inj'; html += ' <b style="color:var(--bad)">'+esc(ev.injuryLabel)+'</b>'; }
  } else if (ev.type === 'event') {
    cls='ev';
    html = '<b>'+esc(ev.title||'이벤트')+'</b> ‘'+esc(ev.choice||'')+'’ ' + esc(ev.badge||'') +
           (ev.resultText ? ' — '+esc(ev.resultText) : '');
  } else if (ev.type === 'bond') {
    cls='ev'; html = '<b>'+esc(ev.title||'인연')+'</b> — '+esc(ev.text||'');
  } else if (ev.type === 'evaluation') {
    cls='eval'; html = esc(ev.text||'');
  } else if (ev.type === 'graduated') {
    html = esc(ev.text||'');
  } else {
    html = esc(ev.text || '');
  }
  if (html) feed.push({ cls:cls, html:html });
}

function finishCamp(){
  lastGrad = E.graduate(ses, 'best');   // 재육성 결과가 기존 대표보다 나쁘면 로스터를 바꾸지 않는다
  var earned = !autoUnlocked && !usedAutoThisCamp;
  if (earned) {
    autoUnlocked = true;
    try { localStorage.setItem(AUTO_KEY, '1'); } catch(e){}
  }
  ses = null; trainPick = null; supPick = null;
  save();
  var gotMissions = checkMissions();
  view = 'trainGrad'; render(); window.scrollTo(0,0);
  if (earned && !gotMissions.length) setTimeout(function(){ toast('자동 진행이 열렸습니다'); }, 600);
}

function autoRun(kind){
  if (!autoUnlocked) { toast('첫 캠프는 직접 진행해야 합니다'); return; }
  usedAutoThisCamp = true;
  var pol = kind==='safe' ? E.POLICIES.safe : E.POLICIES.optimal;
  var guard = 0;
  while (guard++ < 60) {
    var o = E.trainingOptions(ses);
    if (o.kind === 'graduated') break;
    var pick;
    if (o.kind === 'event') pick = 'event:' + pol.chooseEvent(ses, ses.pendingEvent);
    else pick = pol.choose(ses);
    if (typeof pick === 'number') pick = ['serve','receive','set','spike','block','rest','special'][pick];
    var r = E.applyTrainingChoice(ses, pick);
    (r.events||[]).forEach(pushFeed);
  }
  if (E.trainingOptions(ses).kind === 'graduated') finishCamp(); else render();
}

function doMatch(clubId){
  if (!E.lineupValid(G)) E.autoLineup(G);
  mySide = 0;
  lastMatch = E.playMatch(G, clubId, { collectEvents:true });
  save();
  window.scrollTo(0,0);
  startViewer();
}

function doAdvance(){
  leagueTab = 'now';
  if (!E.lineupValid(G)) E.autoLineup(G);
  var sv = E.seasonView(G);
  if (sv && sv.phase === 'matchday' && !sv.nextMatchday) { save(); go('match'); return; }
  var res = E.advanceMatchday(G, { collectEvents:true });
  save(); checkMissions();
  if (res.myMatch) {
    mySide = res.myMatch.isHome === false ? 1 : 0;
    lastMatch = res.myMatch;
    window.scrollTo(0,0);
    startViewer();
  } else {
    toast('매치데이 ' + res.matchday + ' 종료 · 휴식일');
    go('match');
  }
}
function doPlayoff(){
  if (!E.lineupValid(G)) E.autoLineup(G);
  var res = E.advancePlayoff(G, { collectEvents:true });
  save(); checkMissions();
  if (res.myMatch) {
    mySide = res.myMatch.isHome === false ? 1 : 0;

    startViewer();

}
