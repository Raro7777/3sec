name: Android 릴리스

# 서명된 AAB(Play 제출용)와 APK(직접 설치용)를 만든다.
# Actions 탭 → "Android 릴리스" → Run workflow, 또는 v* 태그를 푸시하면 돈다.
# 결과는 이 실행의 아티팩트로 남는다. 내려받아 Play Console → 내부 테스트 → 새 릴리스에 올린다.
#
# 필요한 Secrets (업로드 키 만들기 워크플로의 README 참조):
#   UPLOAD_KEYSTORE_B64        upload-keystore.jks 를 base64 한 한 줄
#   UPLOAD_KEYSTORE_PASSWORD   그 키의 비밀번호 (alias 는 upload, 키 비밀번호는 저장소 비밀번호와 같다)
#
# 선택: Secrets 에 PLAY_SERVICE_ACCOUNT_JSON (Play Console → 설정 → API 액세스 에서 만든 서비스 계정의
# JSON 키 전문) 이 있으면, 빌드한 AAB 를 Play 의 내부 테스트 트랙에 바로 올린다. 없으면 이 단계는 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play 트랙: internal, alpha(기본 비공개), beta, production, 또는 직접 만든 비공개 트랙 이름"
        type: string
        default: internal
      upload:
        description: "Play 에 자동 업로드"
        type: boolean
        default: true
      promote_version_code:
        description: "비워 두면 새로 빌드해 올린다. 숫자를 넣으면 빌드 없이 Play 에 이미 있는 그 버전을 위 트랙에 배정만 한다"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  promote:
    name: 기존 버전을 트랙에 배정
    if: github.event_name == 'workflow_dispatch' && inputs.promote_version_code != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/play-promote.py "${{ inputs.track }}" "${{ inputs.promote_version_code }}"
  release:
    name: 서명된 AAB + APK
    if: github.event_name != 'workflow_dispatch' || inputs.promote_version_code == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # secrets 는 step 의 if 에서 바로 읽을 수 없어서 여기서 참/거짓으로 바꿔 둔다
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets 확인
        shell: bash
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$B64" ] || [ -z "$PW" ]; then
            echo "::error::UPLOAD_KEYSTORE_B64 / UPLOAD_KEYSTORE_PASSWORD 가 없습니다. 먼저 '업로드 키 만들기' 워크플로를 돌리고 README의 두 값을 Settings → Secrets → Actions 에 넣으세요."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (러너에 내장된 SDK 사용)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: 키를 러너에 풀기 (gitignore된 경로)
        shell: bash
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/apps/viewer/android/upload-keystore.jks"
          echo "$B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          cat > apps/viewer/android/keystore.properties <<PROPS
          storeFile=$KS
          storePassword=$PW
          keyAlias=upload
          keyPassword=$PW
          PROPS
          chmod 600 apps/viewer/android/keystore.properties
          keytool -list -keystore "$KS" -storepass "$PW" -alias upload >/dev/null || { echo "::error::키 파일이나 비밀번호가 맞지 않습니다."; exit 1; }
      - name: 웹 빌드 → Android 프로젝트에 동기화
        working-directory: apps/viewer
        run: node scripts/build-worker.mjs && pnpm exec vite build && pnpm exec cap sync android
      - name: AAB + APK 빌드
        working-directory: apps/viewer/android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: 서명 확인
        shell: bash
        run: |
          set -euo pipefail
          AAB=apps/viewer/android/app/build/outputs/bundle/release/app-release.aab
          APK=apps/viewer/android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::AAB가 서명되지 않았습니다."; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify "$APK" || { echo "::error::APK 서명 확인 실패"; exit 1; }
          V=$(grep -o 'versionName "[^"]*"' apps/viewer/android/app/build.gradle | cut -d'"' -f2)
          C=$(grep -o 'versionCode [0-9]*' apps/viewer/android/app/build.gradle | awk '{print $2}')
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$C" >> "$GITHUB_ENV"
          mkdir -p dist-release
          cp "$AAB" "dist-release/가난한자의FM-v$V-$C.aab"
          cp "$APK" "dist-release/가난한자의FM-v$V-$C.apk"
          {
            echo "## 서명된 빌드 v$V (versionCode $C)"
            echo
            echo "아래 **Artifacts → android-release** 를 내려받으세요."
            echo "- \`.aab\` → Play Console → 내부 테스트 → 새 릴리스 → 업로드"
            echo "- \`.apk\` → 폰에 직접 설치해서 확인"
            echo
            echo "다음 빌드 전에 \`apps/viewer/android/app/build.gradle\` 의 versionCode 를 올리세요 (Play는 같은 번호를 두 번 받지 않습니다)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist-release/
          retention-days: 30
          if-no-files-found: error
      - name: Play 내부 테스트에 업로드
        if: env.HAS_PLAY_KEY == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.threesec.fm
          releaseFiles: apps/viewer/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          releaseName: ${{ format('{0} ({1})', env.APP_VERSION_NAME, env.APP_VERSION_CODE) }}
          whatsNewDirectory: apps/viewer/android/whatsnew
      - name: 업로드 결과 요약
        if: always()
        shell: bash
        run: |
          if [ "$HAS_PLAY_KEY" != "true" ]; then
            echo "Play 자동 업로드는 건너뛰었습니다. Secrets 에 PLAY_SERVICE_ACCOUNT_JSON 을 넣으면 다음 실행부터 자동으로 올라갑니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 키 지우기
        if: always()
        run: rm -f apps/viewer/android/upload-keystore.jks apps/viewer/android/keystore.properties
