name: Android 릴리스

# 서명된 AAB(Play 제출용)와 APK(직접 설치용)를 만든다.
# Actions 탭 → "Android 릴리스" → Run workflow, 또는 v* 태그를 푸시하면 돈다.
# 결과는 이 실행의 아티팩트로 남는다. 내려받아 Play Console → 내부 테스트 → 새 릴리스에 올린다.
#
# 필요한 Secrets (업로드 키 만들기 워크플로의 README 참조):
#   UPLOAD_KEYSTORE_B64        upload-keystore.jks 를 base64 한 한 줄
#   UPLOAD_KEYSTORE_PASSWORD   그 키의 비밀번호 (alias 는 upload, 키 비밀번호는 저장소 비밀번호와 같다)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: 서명된 AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Secrets 확인
        shell: bash
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$B64" ] || [ -z "$PW" ]; then
            echo "::error::UPLOAD_KEYSTORE_B64 / UPLOAD_KEYSTORE_PASSWORD 가 없습니다. 먼저 '업로드 키 만들기' 워크플로를 돌리고 README의 두 값을 Settings → Secrets → Actions 에 넣으세요."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: 키를 러너에 풀기 (gitignore된 경로)
        shell: bash
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/apps/viewer/android/upload-keystore.jks"
          echo "$B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          cat > apps/viewer/android/keystore.properties <<PROPS
          storeFile=$KS
          storePassword=$PW
          keyAlias=upload
          keyPassword=$PW
          PROPS
          chmod 600 apps/viewer/android/keystore.properties
          keytool -list -keystore "$KS" -storepass "$PW" -alias upload >/dev/null || { echo "::error::키 파일이나 비밀번호가 맞지 않습니다."; exit 1; }
      - name: 웹 빌드 → Android 프로젝트에 동기화
        working-directory: apps/viewer
        run: node scripts/build-worker.mjs && pnpm exec vite build && pnpm exec cap sync android
      - name: AAB + APK 빌드
        working-directory: apps/viewer/android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: 서명 확인
        shell: bash
        run: |
          set -euo pipefail
          AAB=apps/viewer/android/app/build/outputs/bundle/release/app-release.aab
          APK=apps/viewer/android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::AAB가 서명되지 않았습니다."; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify "$APK" || { echo "::error::APK 서명 확인 실패"; exit 1; }
          V=$(grep -o 'versionName "[^"]*"' apps/viewer/android/app/build.gradle | cut -d'"' -f2)
          C=$(grep -o 'versionCode [0-9]*' apps/viewer/android/app/build.gradle | awk '{print $2}')
          mkdir -p dist-release
          cp "$AAB" "dist-release/가난한자의FM-v$V-$C.aab"
          cp "$APK" "dist-release/가난한자의FM-v$V-$C.apk"
          {
            echo "## 서명된 빌드 v$V (versionCode $C)"
            echo
            echo "아래 **Artifacts → android-release** 를 내려받으세요."
            echo "- \`.aab\` → Play Console → 내부 테스트 → 새 릴리스 → 업로드"
            echo "- \`.apk\` → 폰에 직접 설치해서 확인"
            echo
            echo "다음 빌드 전에 \`apps/viewer/android/app/build.gradle\` 의 versionCode 를 올리세요 (Play는 같은 번호를 두 번 받지 않습니다)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist-release/
          retention-days: 30
          if-no-files-found: error
      - name: 키 지우기
        if: always()
        run: rm -f apps/viewer/android/upload-keystore.jks apps/viewer/android/keystore.properties
